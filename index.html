<meta charset="UTF-8">
<title>APP SẢN XUẤT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --ink:#232323;
  --paper:#F6F4EE;
  --paper-2:#EEEAE0;
  --line:#D8D2C2;
  --graphite:#F3EFE3;
  --graphite-2:#E6E0CE;
  --amber:#E08E45;
  --amber-dark:#C97430;
  --header-ink:#2F4858;
  --green:#4B7A51;
  --green-bg:#E7EFE3;
  --rust:#B0503D;
  --rust-bg:#F4E3DE;
  --muted:#4F4A3E;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber);color:#fff;}

.app-header{
  background:var(--graphite);
  color:var(--header-ink);
  padding:18px 24px 0 24px;
  border-bottom:1px solid var(--graphite-2);
  border-top:4px solid var(--amber);
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  padding-bottom:14px;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand .mark{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:12px;
  letter-spacing:.14em;
  color:#fff;
  background:var(--amber);
  padding:4px 8px;
  border-radius:4px;
}
.brand h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:21px;
  margin:0;
  letter-spacing:.01em;
}
.brand h1 .yr{
  color:#fff;
  background:var(--amber);
  padding:1px 9px;
  border-radius:4px;
  font-weight:700;
}
.year-control{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--graphite-2);
  border-radius:6px;
  padding:4px;
}
.year-control button{
  width:28px;height:28px;
  border:none;background:transparent;color:var(--header-ink);
  font-size:16px;cursor:pointer;border-radius:4px;
  font-family:'IBM Plex Mono',monospace;
}
.year-control button:hover{background:rgba(0,0,0,.06);}
.year-control input{
  width:64px;
  text-align:center;
  background:transparent;
  border:none;
  color:var(--header-ink);
  font-family:'IBM Plex Mono',monospace;
  font-size:15px;
  font-weight:600;
}
.year-control input:focus{outline:none;}

.hazard{
  height:6px;
  background:repeating-linear-gradient(135deg,var(--amber),var(--amber) 10px,var(--header-ink) 10px,var(--header-ink) 20px);
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  background:var(--graphite);
  padding:10px 24px;
  border-bottom:1px solid var(--graphite-2);
}
.tab-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.03em;
  white-space:nowrap;
  padding:7px 14px;
  background:#fff;
  border:1px solid #D8D2C2;
  border-radius:6px;
  color:var(--header-ink);
  cursor:pointer;
}
.tab-btn:hover{background:var(--paper-2);border-color:var(--amber);}
.tab-btn.active{
  color:#fff;
  background:var(--amber);
  border-color:var(--amber-dark);
  box-shadow:0 1px 3px rgba(201,116,48,.4);
}

main{
  max-width:1180px;
  margin:0 auto;
  padding:22px 20px 60px;
}

.month-selector{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:16px;
}
.month-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  padding:6px 12px;
  border-radius:16px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  cursor:pointer;
}
.month-btn:hover{background:var(--paper-2);border-color:var(--amber);}
.month-btn.active{
  background:var(--header-ink);
  border-color:var(--header-ink);
  color:#fff;
}

.stat-cards{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:20px;
}
.stat-card{
  flex:1;
  min-width:150px;
  background:#fff;
  border:1px solid var(--line);
  border-top:3px solid var(--line);
  border-radius:8px;
  padding:14px 16px;
}
.stat-card.accent-order{border-top-color:#E08E45;background:#FDF3E6;}
.stat-card.accent-nvl{border-top-color:#2F6094;background:#EEF4FA;}
.stat-card.accent-tp{border-top-color:#3E7A45;background:#EDF6EE;}
.stat-card .stat-value{
  font-family:'Space Grotesk',sans-serif;
  font-size:26px;
  font-weight:700;
  color:var(--header-ink);
  font-variant-numeric:tabular-nums;
}
.stat-card .stat-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-top:4px;
}

.import-result{
  margin-top:14px;
  padding:12px 14px;
  background:var(--green-bg);
  border:1px solid #BBDDBC;
  border-radius:6px;
  font-size:13px;
  color:#2E5A33;
}
.import-result.has-errors{
  background:var(--rust-bg);
  border-color:#E5C5BA;
  color:#7A3826;
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:24px;
  overflow:hidden;
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.panel-head.head-nvl{background:#DCE9F5;}
.panel-head.head-tp{background:#DDEEDD;}
.panel-head.head-order{background:#FBEAD2;}
.panel-head.head-bom{background:#E9E1F3;}
.panel-head.head-nvl h2 .idx{color:#2F6094;}
.panel-head.head-tp h2 .idx{color:#3E7A45;}
.panel-head.head-order h2 .idx{color:#B9601E;}
.panel-head.head-bom h2 .idx{color:#6E4A9E;}
.panel-head h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:600;
  margin:0;
  letter-spacing:.01em;
  color:var(--header-ink);
  display:flex;
  align-items:center;
  gap:9px;
}
.panel-head h2 .idx{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:600;
  color:var(--amber-dark);
  letter-spacing:.05em;
}
.panel-body{padding:16px;}
.subhead{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:12.5px;
  color:var(--muted);
  margin:0 0 8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.subhead:not(:first-child){margin-top:4px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid var(--line);table-layout:fixed;}
th{
  text-align:center;
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  padding:8px 10px;
  border:1px solid var(--line);
  overflow-wrap:break-word;
}
table.tbl-nvl th{color:#2F6094;font-weight:700;background:#EEF4FA;border-color:#B7CFE6;}
table.tbl-tp th{color:#3E7A45;font-weight:700;background:#EDF6EE;border-color:#BBDDBC;}
table.tbl-order th{color:#B9601E;font-weight:700;background:#FDF3E6;border-color:#F3CE9E;}
table.tbl-bom th{color:#6E4A9E;font-weight:700;background:#F5F0FA;border-color:#D6C4EC;}
td{
  padding:10px 10px;
  border:1px solid #F0EDE3;
  vertical-align:middle;
  color:var(--ink);
  overflow-wrap:break-word;
  text-align:center;
}
table th, table td{text-align:center !important;}
.num{font-family:'IBM Plex Mono',monospace;text-align:right;font-variant-numeric:tabular-nums;font-weight:500;}
.num.in-cell{color:#2E6B37;background:var(--green-bg);font-weight:700;}
.num.out-cell{color:#9C3F2B;background:var(--rust-bg);font-weight:700;}
.num.stock-cell{font-weight:800;color:var(--header-ink);background:#F2EEDF;}
.num.stock-cell.low{background:#FCE9C9;color:#9A5B0E;}
.num.opening-cell{color:var(--amber-dark);background:#F7E9D6;font-weight:700;}
.tag-in{color:var(--green);background:var(--green-bg);border-radius:4px;padding:2px 7px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
.tag-out{color:var(--rust);background:var(--rust-bg);border-radius:4px;padding:2px 7px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
.neg{color:var(--rust);font-weight:700;}
.empty-row td{color:var(--muted);font-style:italic;padding:14px 8px;}

.inline-form{
  display:flex;
  flex-wrap:wrap;
  gap:10px 14px;
  align-items:flex-end;
  margin-top:16px;
  padding:14px;
  background:#FBF7EC;
  border:1px solid #EEDFC0;
  border-radius:8px;
}
.form-title{
  width:100%;
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:13px;
  color:var(--amber-dark);
  margin:0 0 2px;
}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:10.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;}
.field input, .field select{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#FCFBF8;
  min-width:110px;
}
.field input[type=number]{font-family:'IBM Plex Mono',monospace;width:90px;min-width:0;}
.field input[type=date]{font-family:'IBM Plex Mono',monospace;}
.field.grow input, .field.grow select{min-width:170px;}
.btn{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  font-weight:600;
  font-size:13px;
  padding:7px 14px;
  border-radius:5px;
  border:1px solid var(--amber-dark);
  background:var(--amber);
  color:#fff;
  cursor:pointer;
}
.btn:hover{background:var(--amber-dark);}
.btn-ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink);
}
.btn-ghost:hover{background:var(--paper-2);}
.btn-del{
  border:none;background:transparent;color:var(--rust);cursor:pointer;font-size:15px;padding:2px 6px;
}
.btn-del:hover{background:var(--rust-bg);border-radius:4px;}
.btn-edit{
  border:none;background:transparent;color:#2F6094;cursor:pointer;font-size:14px;padding:2px 6px;
}
.btn-edit:hover{background:#DCE9F5;border-radius:4px;}
.row-actions{white-space:nowrap;}
.editing-badge{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:700;
  color:#fff;
  background:#2F6094;
  padding:2px 8px;
  border-radius:10px;
  margin-left:8px;
}
.btn-cancel-edit{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  font-weight:600;
  font-size:12.5px;
  padding:7px 12px;
  border-radius:5px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  cursor:pointer;
}
.btn-cancel-edit:hover{background:var(--paper-2);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:820px){.two-col{grid-template-columns:1fr;}}

.section-note{color:var(--muted);font-size:12px;margin:0 0 10px;}
.loading{padding:60px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

@media print{
  .app-header, .tabs, .hazard, .month-selector, .inline-form, .btn, .btn-ghost, .btn-edit, .btn-del, .btn-cancel-edit, .row-actions, .stat-cards, input[type=file] { display:none !important; }
  body{ background:#fff; }
  .panel{ border:1px solid #999; box-shadow:none; break-inside:avoid; margin-bottom:14px; }
  main{ max-width:100%; padding:0; }
  table{ border:1px solid #999; }
  th, td{ border:1px solid #ccc; }
}

/* ===== HOÀN BẢO 16/11: giao diện 3D + tab Bán hàng ===== */
:root{--edge:#B9782C;--b3-sh:rgba(60,40,10,.28)}
.tabs{background:#E9E0CE;padding:10px 24px 12px;gap:10px}
.tab-btn{border:0;border-bottom:4px solid rgba(0,0,0,.2);border-radius:12px;background:#FFFBF0;color:#3A2A14;font-weight:700;padding:9px 16px;box-shadow:0 3px 6px rgba(60,40,10,.2);transition:transform .12s,box-shadow .12s;text-transform:uppercase;letter-spacing:.04em}
.tab-btn:hover{background:#fff;transform:translateY(-2px);box-shadow:0 7px 12px var(--b3-sh)}
.tab-btn:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.tab-btn.active{background:var(--amber-dark);color:#fff;border-bottom-color:#6E3C0E;box-shadow:0 6px 12px var(--b3-sh)}
.btn{border:0;border-bottom:4px solid var(--edge);border-radius:11px;background:#F6C27A;color:#2A1608;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:8px 16px;box-shadow:0 3px 6px rgba(80,50,10,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{background:#F8CC8E;transform:translateY(-2px);box-shadow:0 7px 12px rgba(80,50,10,.32)}
.btn:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.btn-ghost{background:#3D3630;color:#F2E9DB;border:0;border-bottom:3px solid #1E1A16;border-radius:10px;font-weight:700;box-shadow:0 3px 6px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
.btn-ghost:hover{background:#4A423A;transform:translateY(-2px)}
.btn-ghost:active{transform:translateY(2px);border-bottom-width:1px}
.month-btn{border:0;border-bottom:3px solid rgba(0,0,0,.18);border-radius:12px;box-shadow:0 2px 5px rgba(60,40,10,.18);transition:transform .12s}
.month-btn:hover{transform:translateY(-2px)}
select,input[type=text],input[type=number],input[type=date]{border:1px solid #D9C29B;border-radius:9px;box-shadow:inset 0 2px 4px rgba(60,40,10,.16)}
.panel{background:#FBF5E8;border:0;border-bottom:4px solid #D9C29B;border-radius:14px;box-shadow:0 3px 8px rgba(80,60,20,.16)}
.brand .mark{border-radius:9px;box-shadow:0 3px 6px rgba(0,0,0,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.bh-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bh-bar .sp{flex:1}
.bh-sub{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bh-subbtn{padding:8px 16px;font:700 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;border-radius:12px;border:0;border-bottom:3px solid var(--amber-dark);background:#FFFDF8;color:#3A2A14;cursor:pointer;box-shadow:0 2px 5px rgba(60,40,10,.2);transition:transform .12s}
.bh-subbtn:hover{transform:translateY(-2px)}
.bh-subbtn.on{background:var(--amber-dark);color:#fff;border-bottom-color:#6E3C0E}
.bh-head{background:linear-gradient(100deg,#FBE7C6,#FFFAF0 72%,#fff);border:1px solid #E3C79A;border-left:8px solid var(--amber-dark);border-radius:8px;padding:10px 16px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.bh-head .cr{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7A4510;background:rgba(255,255,255,.65);border:1px solid var(--amber-dark);border-radius:12px;padding:2px 10px}
.bh-head h2{margin:0;font:700 24px 'Space Grotesk',sans-serif;text-transform:uppercase;color:#3A2A14}
.bh-head .d{font-size:12.5px;color:#6B5A3E}
.bh-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.bh-card{background:#FBF5E8;border-bottom:5px solid var(--amber-dark);border-radius:14px;box-shadow:0 4px 9px rgba(80,60,20,.22),inset 0 2px 0 rgba(255,255,255,.7);position:relative;padding:12px 14px 12px 70px;min-height:92px;transition:transform .12s,box-shadow .12s}
.bh-card:hover{transform:translateY(-3px);box-shadow:0 10px 16px rgba(80,60,20,.28),inset 0 2px 0 rgba(255,255,255,.7)}
.bh-card.g{border-bottom-color:#2F7A4B}.bh-card.r{border-bottom-color:#B23A2E}.bh-card.t{border-bottom-color:#1F6F63}
.bh-card .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--amber-dark);box-shadow:0 4px 8px rgba(0,0,0,.28),inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.bh-card.g .ic{background:#2F7A4B}.bh-card.r .ic{background:#B23A2E}.bh-card.t .ic{background:#1F6F63}
.bh-card .l{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#5C3A10}
.bh-card .v{font:700 26px 'Space Grotesk',sans-serif;margin-top:4px;font-variant-numeric:tabular-nums}
.bh-card .s{font-size:12px;color:#5C5648;margin-top:2px}
.bh-two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.bh-box{background:#FBF5E8;border-bottom:4px solid #D9C29B;border-radius:14px;box-shadow:0 3px 8px rgba(80,60,20,.16);padding:14px;margin-bottom:14px}
.bh-box h3{margin:0 0 10px;font:700 15px 'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#5C3A10}
.bh-chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding:4px 6px 0;border-bottom:2px solid #E3D3B0}
.bh-chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bh-chart b{display:block;width:100%;background:var(--amber-dark);border-radius:4px 4px 0 0;min-height:2px}
.bh-chart span{font-size:11px;font-weight:600;margin-bottom:3px}
.bh-lab{display:flex;gap:10px;padding:4px 6px;font-size:11.5px;color:#5C5648}.bh-lab div{flex:1;text-align:center}
.bh-hb{height:10px;background:#EFE9DB;border-radius:5px;overflow:hidden}.bh-hb i{display:block;height:100%;background:#1F6F63}
.bh-t{border-collapse:collapse;width:100%;table-layout:auto!important;font-size:13px;border:1px solid #E3D3B0}
.bh-t td,.bh-t th{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif!important;letter-spacing:0!important;text-transform:none}.bh-t th{background:var(--amber-dark);color:#fff;font-weight:800;font-size:13px;padding:10px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.3)}
.bh-t td{padding:8px 12px;border-right:1px solid #EADFC6;border-top:1px solid #EADFC6}
.bh-t tbody tr:nth-child(even){background:#FBF8F1}.bh-t tbody tr:hover{background:#FFF4DE}
.bh-t td,.bh-t th{overflow:visible!important;text-overflow:clip!important;max-width:none!important}.bh-dt td,.bh-dt th{font-size:12px!important;padding:8px 5px!important}.bh-t td.n,.bh-t th.n{text-align:right;padding-left:8px;padding-right:8px;font-variant-numeric:tabular-nums;white-space:nowrap}.bh-t td.z{color:#A39B88}
.bh-t tr.tong td{background:#FFF3CF;font-weight:700;border-top:2px solid var(--amber-dark)}
.bh-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:10px;border-bottom:2px solid rgba(0,0,0,.15)}
.bh-ok{background:#E9F1E7;color:#2F7A4B}.bh-bad{background:#FBEAE7;color:#B23A2E}.bh-warn{background:#FBF0DE;color:#B8741A}
.bh-note{font-size:12px;color:#5C5648;margin-top:8px}
@media(max-width:800px){.bh-cards{grid-template-columns:1fr 1fr}.bh-two{grid-template-columns:1fr}}

main{max-width:1560px!important;padding-left:24px!important;padding-right:24px!important}

function isoToVN(iso){
  if(!iso) return '';

  return `${d}/${m}/${y}`;
}
function vnToIso(s){
  s = (s||'').trim();
  let match = /^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/.exec(s);
  let d, m, y;
  if(match){
    [, d, m, y] = match;
  } else {
    match = /^(\d{2})(\d{2})(\d{2,4})$/.exec(s.replace(/\D/g,''));
    if(!match) return null;
    [, d, m, y] = match;
  }
  d = d.padStart(2,'0'); m = m.padStart(2,'0');
  if(y.length===2) y = '20'+y;
  const day = Number(d), month = Number(m);
  if(month<1||month>12||day<1||day>31) return null;
  const iso = `${y}-${m}-${d}`;
  const dt = new Date(iso);
  if(isNaN(dt.getTime()) || dt.getUTCDate()!==day || (dt.getUTCMonth()+1)!==month) return null;
  return iso;
}
function formatDateInput(el){
  const v = el.value;
  if(/[\/\-\.]/.test(v)){
    const parts = v.split(/[\/\-\.]/);
    if(parts.length===3){
      const d = parts[0].replace(/\D/g,'').slice(0,2);
      const m = parts[1].replace(/\D/g,'').slice(0,2);
      const y = parts[2].replace(/\D/g,'').slice(0,4);
      el.value = [d,m,y].join('/');
      return;
    }
  }
  const digits = v.replace(/\D/g,'').slice(0,8);
  let out = digits;
  if(digits.length>4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
  else if(digits.length>2) out = digits.slice(0,2)+'/'+digits.slice(2);
  el.value = out;
}

function loadState(){
  let seed = null;
  try{
    const seedEl = document.getElementById('seed-data');
    const seedRaw = seedEl ? seedEl.textContent.trim() : '';
    seed = seedRaw && seedRaw !== 'null' ? JSON.parse(seedRaw) : null;
  }catch(e){
    seed = null;
  }
  let localState = null;
  try{
    const rawLocal = localStorage.getItem('app-data');
    if(rawLocal) localState = JSON.parse(rawLocal);
  }catch(e){ localState = null; }
  let usedUnsavedLocal = false;
  const localNewer = seed && localState && (
    (localState.savedAt||0) > (seed.savedAt||0) ||
    (!localState.savedAt && !seed.savedAt && JSON.stringify(localState)!==JSON.stringify(seed))
  );
  if(localNewer){
    const fmtT = ts=>ts ? new Date(ts).toLocaleString('vi-VN') : 'không rõ thời gian';
    /* Sếp chốt 20/11: không hỏi nữa. File là bản chuẩn (SX/APP cập nhật thẳng vào file); bản trình duyệt được cất làm dự phòng, không mất. */
    try{ localStorage.setItem('app-data-backup-trinhduyet', JSON.stringify(localState)); }catch(e){}
    const useLocal = false;
    if(useLocal){ state = localState; usedUnsavedLocal = true; }
    else {
      state = seed;
      try{ localStorage.setItem('app-data', JSON.stringify(seed)); }catch(e){}
    }
  } else {
    state = seed || localState || defaultState();
  }
  if(!state.bomHistory) state.bomHistory = [];
  if(!state.suppliers) state.suppliers = [];
  if(!state.customers) state.customers = [];
  if(!state.priceList) state.priceList = [];
  if(!state.packingTypes) state.packingTypes = [];
  if(!state.productSkus) state.productSkus = [];
  if(!state.costSettings) state.costSettings = [];
  if(!state.revenueImport) state.revenueImport = null; if(!state.bhPaid) state.bhPaid = {};
  if(!state.bomBatchSize) state.bomBatchSize = {};
  if(!state.lockedMonths) state.lockedMonths = [];
  let needsSave = seedReferenceCustomersOnce();
  if(seedPresetPackingTypesOnce()) needsSave = true;
  if(seedReferenceSkusOnce()) needsSave = true;
  if(clearDefaultXuatNvlNotesOnce()) needsSave = true;
  if(seedOpeningStockJan2026Once()) needsSave = true;
  if(seedNvlPurchasesH1_2026Once()) needsSave = true;
  if(fixMissingNhuaThongApr2026Once()) needsSave = true;
  if(needsSave) saveState(true);
  if(usedUnsavedLocal) fileDirty = true;
  document.getElementById('yearInput').value = currentYear;
  updateFileDirtyBadge();
  buildTabs();
  render();
}

let htmlFileHandle = null;
async function saveToHtmlFile(){
  if(!window.showOpenFilePicker){
    alert('Trình duyệt này không hỗ trợ lưu trực tiếp vào file (chỉ Chrome/Edge trên máy tính). Hãy dùng "Tải xuống dữ liệu (.json)" thay thế.');
    return;
  }
  try{
    if(!htmlFileHandle){
      alert('Ở cửa sổ tiếp theo, hãy chọn đúng file HTML này (file bạn đang mở) để lưu dữ liệu vào.');
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'File HTML', accept: {'text/html': ['.html']} }]
      });
      htmlFileHandle = handle;
    }
    const perm = await htmlFileHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ alert('Cần cấp quyền ghi file để lưu.'); return; }
    const file = await htmlFileHandle.getFile();
    let text = await file.text();
    const re = /(<script id="seed-data" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(text)){
      alert('Không tìm thấy vị trí lưu dữ liệu trong file này. Có thể bạn đã chọn nhầm file khác — hãy thử lại và chọn đúng file HTML đang mở.');
      htmlFileHandle = null;
      return;
    }
    saveState();
    text = text.replace(re, (m, openTag, closeTag)=> openTag + JSON.stringify(state) + closeTag);
    const writable = await htmlFileHandle.createWritable();
    await writable.write(text);
    await writable.close();
    fileDirty = false;
    updateFileDirtyBadge();
    alert('Đã lưu dữ liệu vào chính file HTML này. Giờ chỉ cần copy file này sang máy khác là dùng được ngay, không cần file .json kèm theo.');
  }catch(err){
    if(err.name !== 'AbortError') alert('Lỗi khi lưu vào file: ' + err.message);
  }
}

      <div class="bh-box"><h3>Top 8 khách hàng</h3><table class="bh-t"><thead><tr><th>#</th><th>Khách hàng</th><th>Số dòng</th><th>Doanh thu</th><th>Mua gần nhất</th></tr></thead><tbody>${top.map((c,i)=>`<tr><td class="n">${i+1}</td><td>${esc(c.name)}</td><td class="n">${c.n}</td><td class="n">${bhF(c.amount)}</td><td>${esc(c.last)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if(bhView==='dt'){

    yr.forEach(s=>{ rev[bhFam(s)][+String(s.date).slice(5,7)-1]+=+s.amount||0; });
    const col=Array(12).fill(0); fams.forEach(f=>rev[f].forEach((v,i)=>col[i]+=v));

    const famTot=fams.map(f=>[f,rev[f].reduce((x,y)=>x+y,0)]).sort((x,y)=>y[1]-x[1]); const top=famTot[0]||['-',0];

    body=dtCards+`<div class="bh-box"><h3>Doanh thu chưa VAT theo mã hàng × tháng ${currentYear} (đồng)</h3><div style="overflow-x:auto"><table class="bh-t bh-dt"><thead><tr><th>Mã hàng</th>${used.map(i=>`<th class="n">T${i+1}</th>`).join('')}<th class="n">Cộng</th></tr></thead><tbody>${fams.map(f=>`<tr><td><b>${f}</b></td>${used.map(i=>`<td class="n ${rev[f][i]?'':'z'}">${rev[f][i]?bhF(rev[f][i]):'-'}</td>`).join('')}<td class="n"><b>${bhF(rev[f].reduce((a,c)=>a+c,0))}</b></td></tr>`).join('')}<tr class="tong"><td>TỔNG</td>${used.map(i=>`<td class="n">${bhF(col[i])}</td>`).join('')}<td class="n">${bhF(col.reduce((a,c)=>a+c,0))}</td></tr></tbody></table></div><div class="bh-note">Nguồn: file QLBH, tính đến ${esc(b.upto)}.</div></div>`;

    <div class="bh-box"><h3>Khách hàng ${currentMonth?'tháng '+currentMonth:'năm '+currentYear}</h3><div style="margin-bottom:10px"><input type="text" placeholder="🔎 Tìm theo tên hoặc mã..." value="${esc(bhSearch)}" oninput="bhSearchInput(this.value)" style="width:320px;max-width:100%;padding:8px 10px"></div><div style="overflow-x:auto"><table class="bh-t"><thead><tr><th>Khách hàng</th><th>Số dòng</th><th>Doanh thu</th><th>Tổng thu</th><th>Còn nợ</th><th>Mua gần nhất</th><th>Trạng thái</th></tr></thead><tbody id="bhCustBody"></tbody></table></div></div>`;
  }
  return bar+sub+head+body;
}

let bhCtSearch='', bhCtPay='';
function bhCtRows(){
  const q=bhCtSearch.trim().toLowerCase(); const b=bhData();
  const so={}; (b.notes||[]).forEach(d=>(d.rel||[]).forEach(id=>{ so[id]=d.soPhieu; }));
  return bhRows().filter(s=>{
    if(bhCtPay){ const k=bhIsDebt(s)?'debt':(s.paid||'X'); if(bhCtPay!==k) return false; }
    if(!q) return true;
    return (bhName(s)+' '+(s.prodCode||'')+' '+(s.prodName||'')+' '+(s.note||'')).toLowerCase().includes(q);
  }).sort((a,c)=>c.date.localeCompare(a.date)||String(c.id).localeCompare(String(a.id))).map(s=>Object.assign({},s,{so:so[s.id]||''}));
}

function bhPageGia(){
  const b=bhData(); const price=b.price||[], quotes=b.quotes||[];
  const latest={}; price.forEach(x=>{ if(!latest[x.code]||x.date>=latest[x.code].date) latest[x.code]=x; });
  const rows=Object.values(latest).sort((a,c)=>a.name.localeCompare(c.name,'vi'));
  const qv=quotes.slice().sort((a,c)=>c.date.localeCompare(a.date));
  const qt=q=>q.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0)*(1+(+q.vat||0)/100);
  const st={sent:'Đã gửi',draft:'Nháp',accepted:'Khách đồng ý',rejected:'Từ chối'};
  return `<div class="bh-box"><h3>Bảng giá hiện hành (${rows.length} mã)</h3><div style="overflow-x:auto"><table class="bh-t"><thead><tr><th>Mã</th><th>Tên hàng</th><th>Giá lẻ</th><th>Giá sỉ</th><th>Hiệu lực từ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td class="n">${x.price?bhF(x.price):'-'}</td><td class="n ${x.wholesale?'':'z'}">${x.wholesale?bhF(x.wholesale):'-'}</td><td>${esc(x.date)}</td></tr>`).join('')}</tbody></table></div></div>

function bhPagePhieu(){

/* gợi ý mua NVL theo phuy */
function nvlSuggest(){
  const cfg=Object.assign({warnDays:30,targetDays:60,lookDays:90},state.autoCfg||{});
  const to=todayStr(), from=new Date(Date.now()-cfg.lookDays*864e5).toISOString().slice(0,10);
  return state.materials.map(m=>{
    const out=state.nvlTx.filter(t=>t.materialId===m.id&&t.type==='out'&&t.source!=='opening_adjust'&&t.date>=from&&t.date<=to).reduce((s,t)=>s+Number(t.qty||0),0);
    const daily=out/cfg.lookDays; if(daily<=0) return null;
    const stock=nvlClosingAll(m), cover=stock/daily; if(cover>=cfg.warnDays) return null;
    const need=Math.max(0,cfg.targetDays*daily-stock), k=nvlPhuyKg(m);
    return {m,daily,stock,cover,need,k,phuy:k?Math.ceil(need/k):null};
  }).filter(Boolean).sort((a,b)=>a.cover-b.cover);
}

function applyOpeningAdjustment(materialId, monthStart, target){
  const adjDate = dayBefore(monthStart);
  const existing = state.nvlTx.find(t=>t.materialId===materialId && t.source==='opening_adjust' && t.date===adjDate);
  const existingSigned = existing ? (existing.type==='in'? existing.qty : -existing.qty) : 0;
  const currentComputed = openingStock(state.nvlTx, 'materialId', materialId, monthStart);
  const baseWithoutAdj = currentComputed - existingSigned;
  const newAdj = target - baseWithoutAdj;
  if(existing) state.nvlTx = state.nvlTx.filter(t=>t!==existing);
  if(Math.abs(newAdj) > 1e-9){
    state.nvlTx.push({id: uid(), materialId, type: newAdj>0?'in':'out', qty: Math.abs(newAdj), date: adjDate, note:'Điều chỉnh tồn đầu kỳ', source:'opening_adjust'});

}

    state.productTx.push({id: uid(), productId, type: newAdj>0?'in':'out', qty: Math.abs(newAdj), date: adjDate, note:'Điều chỉnh tồn đầu kỳ', source:'opening_adjust', packingId:null, packQty:null});

}
function applyProductPackingOpeningAdjustment(productId, packingId, monthStart, targetPackQty, pkKg){

function computeAvgPrice(material, asOfDate){
  const all = state.nvlTx.filter(t=>t.materialId===material.id && t.type==='in' && t.price && Number(t.price)>0);
  if(!all.length) return { value: Number(material.price||0), isAuto:false };
  let priced = asOfDate ? all.filter(t=>t.date<=asOfDate) : all;
  let approx = false;
  if(!priced.length){
    const minDate = all.map(t=>t.date).sort()[0];
    priced = all.filter(t=>t.date===minDate);
    approx = true;
  }
  const totalQty = priced.reduce((s,t)=>s+Number(t.qty||0),0);
  const totalValue = priced.reduce((s,t)=>s+Number(t.qty||0)*Number(t.price||0),0);
  return { value: totalQty>0 ? totalValue/totalQty : Number(material.price||0), isAuto:true, approx };
}

function productCostGaps(productId, uptoDateExclusive){

function renderLoiLoPanel(month, monthStart, monthEndExclusive){

  else { monthsInRange.push(`${currentYear}-${pad(month)}`); }

  const productIdsSet = new Set();
  state.orders.forEach(o=>{ if(o.date>=monthStart && o.date<monthEndExclusive) productIdsSet.add(o.productId); });
  if(revImport){
    Object.keys(revImport.byProductMonth).forEach(pid=>{
      const monthsData = revImport.byProductMonth[pid];
      if(monthsInRange.some(ym=>monthsData[ym])) productIdsSet.add(pid);

  }

  const rows = [...productIdsSet].map(pid=>{
    const producedQty = state.orders.filter(o=>o.productId===pid && o.date>=monthStart && o.date<monthEndExclusive).reduce((s,o)=>s+Number(o.qty||0),0);
    let revenue=0, soldQty=0;

  const noOrderProducts = rows.filter(r=>r.gaps.noOrders).map(r=>r.name);
  const allNoLaborMonths = [...new Set(rows.flatMap(r=>r.gaps.noLaborMonths))].sort();
  const gapBanner = rows.some(r=>r.incomplete) ? `
    <div style="background:#FFF3D9;border:1px solid #E8C878;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#7A4B0A">
      <strong>⚠ Giá vốn chưa đầy đủ — lợi nhuận hiển thị đang cao hơn thực tế.</strong>

function computeProductCost(productId){
  const orders = state.orders.filter(o=>o.productId===productId);
  if(!orders.length) return 0;
  const totalQty = orders.reduce((s,o)=>s+Number(o.qty||0),0);
  const totalCost = orders.reduce((s,o)=>s+orderNvlCost(o.id),0);
  return totalQty>0 ? totalCost/totalQty : 0;
}
function currentPrice(productId, date){
  const p = state.products.find(x=>x.id===productId);
  const list = (state.priceList||[]).filter(e=>e.productId===productId && e.date<=date).sort((a,b)=>b.date.localeCompare(a.date));
  if(list.length) return Number(list[0].price)||0;
  return p ? Number(p.price||0) : 0;
}

function sumTx(list, idField, id, dateFrom, dateToExclusive, type){
  return list.filter(t=>t[idField]===id && (!type||t.type===type) &&
      (!dateFrom || t.date>=dateFrom) && (!dateToExclusive || t.date<dateToExclusive))
    .reduce((s,t)=>s+Number(t.qty||0),0);
}
function openingStock(list, idField, id, monthStart){
  const inSum = sumTx(list, idField, id, null, monthStart, 'in');
  const outSum = sumTx(list, idField, id, null, monthStart, 'out');
  return inSum - outSum;
}

const SALE_IMPORT_FROM = '2026-01-01';
let qlbhPending = null;

function adjSummary(){
  const map = {};
  state.productTx.filter(t=>t.source==='opening_adjust').forEach(t=>{
    const key = t.productId+'|'+(t.packingId||'')+'|'+t.date;
    const sign = t.type==='in' ? 1 : -1;
    const val = t.packingId ? sign*Number(t.packQty||0) : sign*Number(t.qty||0);
    map[key] = { label: productName(t.productId)+' / '+(t.packingId?packingLabel(t.packingId):'kg lẻ'), date: t.date, unit: t.packingId?'':'kg', val: (map[key]?map[key].val:0)+val };
  });
  return map;
}
function findNegativeTp(){
  const out = [];
  const lastDate = state.productTx.map(t=>t.date).sort().slice(-1)[0] || SALE_IMPORT_FROM;
  const lastYm = lastDate.slice(0,7);
  const combos = new Set(state.productTx.map(t=>t.productId+'|'+(t.packingId||'')));
  combos.forEach(k=>{
    const [pid, pk] = k.split('|');
    let first = null, min = 0;
    for(let y=Number(SALE_IMPORT_FROM.slice(0,4)), m=1; ; ){
      const ym = `${y}-${pad(m)}`;
      if(ym>lastYm) break;
      const bd = productPackBreakdown(pid, monthEndExclusiveFor(ym+'-01'));
      const val = pk ? (bd.byPacking[pk]||0) : bd.rawKg;
      if(val < -0.001){ if(!first) first = ym; if(val<min) min = val; }
      m++; if(m>12){ m=1; y++; }
    }
    if(first) out.push({ label: productName(pid)+' / '+(pk?packingLabel(pk):'kg lẻ'), unit: pk?'':' kg', first, min });
  });
  return out;
}
function applyQlbhSales(saleLines, fromDate){
  fromDate = fromDate || SALE_IMPORT_FROM;
  const adjs = state.productTx.filter(t=>t.source==='opening_adjust' && !isMonthLocked(t.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const seen = new Set();
  const targets = [];
  adjs.forEach(t=>{
    const key = t.productId+'|'+(t.packingId||'')+'|'+t.date;
    if(seen.has(key)) return;
    seen.add(key);
    const monthStart = dayAfter(t.date);
    const bd = productPackBreakdown(t.productId, monthStart);
    targets.push({ productId:t.productId, packingId:t.packingId||null, monthStart, target: t.packingId ? (bd.byPacking[t.packingId]||0) : bd.rawKg });
  });
  state.productTx = state.productTx.filter(t=>!((t.source==='sale_import' || t.source==='repack_auto') && t.date>=fromDate && !isMonthLocked(t.date)));
  const keyBalance = (pid, pk, upto)=>{
    const cand = targets.filter(x=>x.productId===pid && x.packingId===pk && x.monthStart<=upto).sort((a,b)=>a.monthStart.localeCompare(b.monthStart)).pop();
    const startDate = cand ? cand.monthStart : '0000-00-00';
    let bal = cand ? cand.target : 0;
    state.productTx.forEach(t=>{
      if(t.productId!==pid || (t.packingId||null)!==pk || t.source==='opening_adjust' || t.date<startDate || t.date>upto) return;
      bal += (t.type==='in'?1:-1) * (pk ? Number(t.packQty||0) : Number(t.qty||0));
    });
    return bal;
  };
  [...saleLines].sort((a,b)=>a.date.localeCompare(b.date) || String(a.qlbhId).localeCompare(String(b.qlbhId))).forEach(l=>{
    if(l.packingId && l.type!=='in'){
      const pk = packingType(l.packingId);
      const need = l.packQty - keyBalance(l.productId, l.packingId, l.date);
      if(pk && need > 0.0005){
        const want = Math.ceil(need - 1e-6);
        const canPack = Math.max(0, Math.floor(keyBalance(l.productId, null, l.date)/pk.kg + 1e-9));
        const take = Math.min(want, canPack);
        if(take > 0){
          state.productTx.push({ id: uid(), productId: l.productId, type:'out', qty: take*pk.kg, packQty: null, packingId: null, date: l.date, note: 'Đóng gói từ kg lẻ: '+take+' '+pk.name+' (tự động theo bán hàng QLBH)', source:'repack_auto' });
          state.productTx.push({ id: uid(), productId: l.productId, type:'in', qty: take*pk.kg, packQty: take, packingId: l.packingId, date: l.date, note: 'Đóng gói từ kg lẻ (tự động theo bán hàng QLBH)', source:'repack_auto' });
        }
      }
    }
    state.productTx.push({ id: uid(), productId: l.productId, type: l.type==='in'?'in':'out', qty: l.qty, packQty: l.packQty, packingId: l.packingId, date: l.date,
      note: l.noteText ? (l.noteText+(l.custName?' — '+l.custName:'')) : 'Bán hàng QLBH'+(l.custName?' — '+l.custName:''), source:'sale_import', customerId: l.customerId, price: l.price, qlbhId: l.qlbhId });
  });
  targets.filter(x=>x.monthStart>fromDate).forEach(x=>{
    if(x.packingId){ const pk = packingType(x.packingId); applyProductPackingOpeningAdjustment(x.productId, x.packingId, x.monthStart, x.target, pk?pk.kg:1); }
    else applyProductRawOpeningAdjustment(x.productId, x.monthStart, x.target);
  });
}
function simulateQlbhImport(pending){
  const backup = state.productTx;
  state.productTx = JSON.parse(JSON.stringify(backup));
  try{
    const beforeAdj = adjSummary();
    const negBefore = findNegativeTp();
    applyQlbhSales(pending.saleLines, pending.fromDate);
    const repackMap = {};
    state.productTx.filter(t=>t.source==='repack_auto' && t.type==='in').forEach(t=>{
      const k = productName(t.productId)+' / '+packingLabel(t.packingId);
      repackMap[k] = repackMap[k] || {packs:0, kg:0};
      repackMap[k].packs += Number(t.packQty||0);
      repackMap[k].kg += Number(t.qty||0);
    });
    return { beforeAdj, afterAdj: adjSummary(), negBefore, negAfter: findNegativeTp(), repackMap };
  } finally {
    state.productTx = backup;
  }
}

function importRevenueFromQlbhFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const text = e.target.result;
      const m = text.match(/<script[^>]*id=["']embedded-state["'][^>]*>([\s\S]*?)<\/script>/);
      if(!m){ alert('Không tìm thấy dữ liệu trong file này. Hãy chọn đúng file HTML của app QLBH-Giao hàng đã lưu (bấm "Lưu file" bên đó trước).'); return; }
      const raw = m[1].trim();
      if(!raw || raw==='{}'){ alert('File này chưa có dữ liệu đã lưu. Hãy chọn file QLBH đã bấm "Lưu file" ít nhất 1 lần.'); return; }
      const qlbh = JSON.parse(raw);
      if(!Array.isArray(qlbh.sales) || !Array.isArray(qlbh.products)){ alert('File không đúng định dạng app QLBH-Giao hàng.'); return; }
      const skuByCode = {};
      state.productSkus.forEach(s=>{ skuByCode[s.code] = s; });
      const custByCode = {};
      state.customers.forEach(c=>{ if(c.code) custByCode[String(c.code).trim().toLowerCase()] = c; });
      const byProductMonth = {};
      let matched = 0, unmatched = 0, skippedOld = 0, skippedLocked = 0, skippedWh = 0;
      const unmatchedCodes = {};
      const saleLines = [];
      const whCfgQ = (qlbh.companySettings && qlbh.companySettings.wh) || null;
      const whFromQ = whCfgQ && whCfgQ.enabledFrom ? whCfgQ.enabledFrom : null;
      const whInfo = { enabledFrom: whFromQ, signedNotes: 0, signedLines: 0, adjLines: 0, pendingNotes: 0, pendingKg: 0 };
      qlbh.sales.forEach(s=>{
        const sku = skuByCode[s.prodCode];
        const ym = String(s.date||'').slice(0,7);
        if(!sku || !ym){ unmatched++; if(s.prodCode) unmatchedCodes[s.prodCode] = (unmatchedCodes[s.prodCode]||0)+1; return; }
        matched++;
        const productId = sku.baseProductId;
        if(!byProductMonth[productId]) byProductMonth[productId] = {};
        if(!byProductMonth[productId][ym]) byProductMonth[productId][ym] = {revenue:0, qty:0};
        byProductMonth[productId][ym].revenue += Number(s.amount||0);
        byProductMonth[productId][ym].qty += Number(s.qty||0);
        if(s.date < SALE_IMPORT_FROM){ skippedOld++; return; }
        if(whFromQ && s.date >= whFromQ){ skippedWh++; return; }
        if(isMonthLocked(s.date)){ skippedLocked++; return; }
        const qty = Math.round(Number(s.qty||0)*1e6)/1e6;
        if(!(qty>0)) return;
        const pk = sku.packingId ? packingType(sku.packingId) : null;
        const cust = custByCode[String(s.custCode||'').trim().toLowerCase()];
        saleLines.push({
          qlbhId: s.id, productId, packingId: pk ? pk.id : null,
          qty, packQty: pk ? Math.round(qty/pk.kg*1000)/1000 : null,
          price: qty>0 ? Math.round(Number(s.amount||0)/qty*100)/100 : 0,
          date: s.date, customerId: cust ? cust.id : null, custName: s.custName || s.custCode || '', code: s.prodCode
        });
      });
      if(whFromQ){
        const skuSet = skuByCode;
        const addLine = (qlbhId, prodCode, qty, price, date, custCode, custName, type, noteText)=>{
          const sku = skuSet[prodCode];
          if(!sku){ unmatched++; if(prodCode) unmatchedCodes[prodCode] = (unmatchedCodes[prodCode]||0)+1; return; }
          if(date < SALE_IMPORT_FROM){ skippedOld++; return; }
          if(isMonthLocked(date)){ skippedLocked++; return; }
          const q = Math.round(Number(qty||0)*1e6)/1e6;
          if(!(q>0)) return;
          const pk = sku.packingId ? packingType(sku.packingId) : null;
          const cust = custByCode[String(custCode||'').trim().toLowerCase()];
          saleLines.push({ qlbhId, productId: sku.baseProductId, packingId: pk?pk.id:null, qty:q, packQty: pk ? Math.round(q/pk.kg*1000)/1000 : null,
            price: Math.round(Number(price||0)*100)/100, date, customerId: cust?cust.id:null, custName: custName||custCode||'', code: prodCode, type: type||'out', noteText });
        };
        (qlbh.deliveryNotes||[]).forEach(d=>{
          if(!d.wh || d.wh.status!=='signed') return;
          whInfo.signedNotes++;
          const cname = (d.custSnapshot && d.custSnapshot.name) || d.custCode || '';
          (d.wh.items||[]).forEach((it,i)=>{
            whInfo.signedLines++;
            addLine(d.id+':'+i, it.prodCode, it.qty, it.price, String(d.date||'').slice(0,10), d.custCode, cname, 'out', 'Xuất kho '+(d.soPhieu||'')+' — thủ kho '+(d.wh.signedBy||'')+' ký');
          });
          (d.wh.adjustments||[]).forEach(a=>(a.lines||[]).forEach((l,i)=>{
            whInfo.adjLines++;
            const delta = Number(l.deltaKg)||0;
            addLine(a.id+':'+i, l.prodCode, Math.abs(delta), 0, String(a.date||'').slice(0,10), d.custCode, cname, delta>0?'in':'out', 'Điều chỉnh phiếu '+(d.soPhieu||'')+': '+(a.reason||'')+' ('+(a.by||'')+')');
          }));
        });
        (qlbh.deliveryNotes||[]).forEach(d=>{
          if(d.wh && d.wh.status==='draft'){
            whInfo.pendingNotes++;
            whInfo.pendingKg += (d.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
          }
        });
      }
      const bhCust = {}; (qlbh.customers||[]).forEach(c=>{ if(c.code && c.name && c.name!==c.code) bhCust[c.code]=c.name; });
      const bhSales = qlbh.sales.filter(x=>String(x.date||'')>='2026-01-01').map(x=>({id:x.id,date:x.date,custCode:x.custCode||'',custName:x.custName||'',prodCode:x.prodCode||'',prodName:x.prodName||'',unit:x.unit||'',qty:x.qty,price:x.price,amount:x.amount,vat:x.vat||0,ship:x.ship||0,total:x.total,paid:x.paid||'',note:x.note||''}));
      const bhNotes = (qlbh.deliveryNotes||[]).map(d=>({id:d.id,soPhieu:d.soPhieu,date:d.date,custCode:d.custCode,items:(d.items||[]).map(i=>({prodCode:i.prodCode,prodName:i.prodName,unit:i.unit||'',qty:i.qty,price:i.price})),whStatus:(d.wh&&d.wh.status)||'',ship:d.shippingUnit||'',rel:d.relatedSaleIds||[],cs:d.custSnapshot?{name:d.custSnapshot.name||'',address:d.custSnapshot.address||'',phone:d.custSnapshot.phone||'',tax:d.custSnapshot.tax||''}:null,vat:Number(d.vat)||0,shipFee:Number(d.ship)||0,shipPayer:d.shipPayer||'',rn:d.receiverName||'',rp:d.receiverPhone||'',addr:d.deliveryAddress||'',pay:d.paymentMethod||'',note:d.note||'',sign:d.signStatus||''}));
      const _cs=qlbh.companySettings||{}; const bhCompany={name:_cs.companyName||'',tax:_cs.companyTax||'',address:_cs.companyAddress||'',hotline:_cs.companyHotline||'',email:_cs.companyEmail||'',web:_cs.companyWebsite||'',bank:_cs.companyBankName||'',acc:_cs.companyBankAccount||''};
      const bhQuotes = (qlbh.quotes||[]).map(q=>({id:q.id,so:q.soBaoGia,date:q.date,custName:q.custName||q.custCode,items:(q.items||[]).map(i=>({prodCode:i.prodCode,prodName:i.prodName,qty:i.qty,price:i.price})),vat:q.vatRate||0,status:q.status||''}));
      const bhPrice = (qlbh.pricelist||[]).map(x=>({date:x.date,code:String(x.code),name:x.name,price:Number(x.price)||0,wholesale:Number(x.priceWholesale)||0}));
      const bhUpto = bhSales.reduce((m,x)=>x.date>m?x.date:m,'');
      const revenueImport = { importedAt: new Date().toISOString(), sourceFileName: file.name, bh:{ importedAt:new Date().toISOString(), upto:bhUpto, cust:bhCust, sales:bhSales, notes:bhNotes, company:bhCompany, quotes:bhQuotes, price:bhPrice }, byProductMonth, matched, unmatched, unmatchedCodes:Object.keys(unmatchedCodes) };
      const lastSaleDate = state.productTx.filter(t=>t.source==='sale_import').map(t=>t.date).sort().slice(-1)[0];
      const defaultFrom = lastSaleDate ? dayAfter(lastSaleDate) : SALE_IMPORT_FROM;
      qlbhPending = { revenueImport, allLines: saleLines, saleLines: [], fromDate: defaultFrom, unmatchedCodes, skippedOld, skippedLocked, skippedWh, whInfo, skippedBeforeFrom: 0 };
      showQlbhPreview();
    }catch(err){
      alert('Lỗi đọc file: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function parseVNNumber(str){
  let s = (str||'').trim();
  if(!s) return NaN;
  if(/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s)) s = s.replace(/\./g,'').replace(',', '.');
  else if(/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  return parseFloat(s);
}

function doImportBom(){
  const productId = document.getElementById('importBomProductSelect').value;
  const text = document.getElementById('importBomText').value;
  const fullSyncEl = document.getElementById('importBomFullSync');
  const fullSync = fullSyncEl ? fullSyncEl.checked : false;
  const batchModeEl = document.getElementById('importBomBatchMode');
  const batchMode = batchModeEl ? batchModeEl.checked : false;
  const dateEl = document.getElementById('importBomDate');
  const changeDate = (dateEl ? vnToIso(dateEl.value) : null) || todayStr();
  const lines = text.split('\n');
  let added = 0, updated = 0, removed = 0, replaced = 0, skipped = 0;
  const errors = [];
  if(!state.bom[productId]) state.bom[productId] = [];
  const bomLines = state.bom[productId];

  const parsed = [];
  lines.forEach(raw=>{
    const line = raw.trim();
    if(!line){ skipped++; return; }
    let parts = line.split('\t');
    if(parts.length < 2) parts = line.split(/\s{2,}/);
    const matName = (parts[0]||'').trim();
    const qty = parseVNNumber(parts[1]);
    if(!matName || isNaN(qty)){ skipped++; return; }
    const material = state.materials.find(m=>m.name.toLowerCase()===matName.toLowerCase());
    if(!material){ errors.push(matName); return; }
    parsed.push({materialId: material.id, qty});
  });

  let batchTotal = 0;
  if(batchMode && parsed.length){
    batchTotal = parsed.reduce((s,p)=>s+p.qty,0);
    if(batchTotal>0) parsed.forEach(p=>{ p.qty = p.qty/batchTotal; });
  }

  const parsedIds = new Set(parsed.map(p=>p.materialId));
  const existingNvlLines = bomLines.filter(l=>l.materialId);
  const oldIds = new Set(existingNvlLines.map(l=>l.materialId));
  let toRemove = fullSync ? existingNvlLines.filter(l=>!parsedIds.has(l.materialId)).map(l=>l.materialId) : [];
  let toAdd = parsed.filter(p=>!oldIds.has(p.materialId));

  if(fullSync && toRemove.length===1 && toAdd.length===1){
    const oldMaterialId = toRemove[0];
    const addEntry = toAdd[0];
    const idx = bomLines.findIndex(l=>l.materialId===oldMaterialId);
    const oldLineQty = idx>=0 ? bomLines[idx].qty : null;
    if(idx>=0) bomLines.splice(idx,1);
    bomLines.push({materialId: addEntry.materialId, qty: addEntry.qty});
    logBomChange(productId, addEntry.materialId, oldLineQty, addEntry.qty, oldMaterialId, changeDate);
    replaced++;
    toRemove = []; toAdd = [];
  }

  toRemove.forEach(matId=>{
    const idx = bomLines.findIndex(l=>l.materialId===matId);
    if(idx>=0){
      logBomChange(productId, matId, bomLines[idx].qty, null, null, changeDate);
      bomLines.splice(idx,1);
      removed++;
    }
  });

  parsed.forEach(p=>{
    const existingLine = bomLines.find(l=>l.materialId===p.materialId);
    if(existingLine){
      if(existingLine.qty !== p.qty){ logBomChange(productId, p.materialId, existingLine.qty, p.qty, null, changeDate); updated++; }
      existingLine.qty = p.qty;
    } else {
      bomLines.push({materialId: p.materialId, qty: p.qty});
      logBomChange(productId, p.materialId, null, p.qty, null, changeDate);
      added++;
    }
  });

  importBomResult = { added, updated, removed, replaced, skipped, errors, batchTotal };
  saveState(); render();
}

function doImportOpeningStock(){
  const month = parseInt(document.getElementById('openImportMonth').value, 10);
  const year = parseInt(document.getElementById('openImportYear').value, 10);
  const monthStart = `${year}-${pad(month)}-01`;
  const text = document.getElementById('openImportText').value;
  const lines = text.split('\n');
  let added = 0, skipped = 0;
  const errors = [];
  const diffs = [];

  lines.forEach(raw=>{
    const line = raw.trim();
    if(!line){ skipped++; return; }
    let parts = line.split('\t');
    if(parts.length < 2) parts = line.split(/\s{2,}/);
    const matName = (parts[0]||'').trim();
    const qty = parseVNNumber(parts[1]);
    if(!matName || isNaN(qty)){ skipped++; return; }
    const material = state.materials.find(m=>m.name.toLowerCase()===matName.toLowerCase());
    if(!material){ errors.push(matName); return; }
    const result = applyOpeningAdjustment(material.id, monthStart, qty);
    if(Math.abs(result.diff) > 1e-9){
      diffs.push({name: material.name, bookQty: result.baseWithoutAdj, actualQty: qty, diff: result.diff});
    }
    added++;
  });

  importOpeningResult = { added, skipped, errors, diffs };
  saveState(); render();
}
function doImportSales(){
  const text = document.getElementById('salesImportText').value;
  const allLines = text.replace(/\r/g,'').split('\n');
  const lines = allLines.filter(l=>l.trim().length>0);
  let added = 0, skipped = allLines.length - lines.length;
  const errors = [];

  let dataLines = lines.map(l=>l.split('\t'));
  const firstLower = dataLines.length ? dataLines[0].map(c=>String(c||'').toLowerCase()) : [];
  if(dataLines.length && dataLines[0].length>1 && firstLower.some(c=>c.includes('ngày')||c.includes('mã sp')||c.includes('mã kh'))){
    dataLines = dataLines.slice(1);
  }

  dataLines.forEach((cells, i)=>{
    const rowNum = i+1;
    const get = idx => (cells[idx]!=null ? String(cells[idx]).trim() : '');
    const dateRaw = get(0);
    const custCode = get(1);
    const prodName = get(2);
    const packingName = get(3);
    const packQtyRaw = get(4);
    const packPriceRaw = get(5);
    const note = get(9);
    if(!dateRaw && !custCode && !prodName && !packQtyRaw){ skipped++; return; }

    const date = vnToIso(dateRaw);
    if(!date){ errors.push(`Dòng ${rowNum}: ngày "${dateRaw}" không hợp lệ`); return; }

    const product = state.products.find(p=>p.name.toLowerCase()===prodName.toLowerCase());
    if(!product){ errors.push(`Dòng ${rowNum}: không tìm thấy sản phẩm "${prodName}"`); return; }

    let packing = null;
    if(packingName){
      packing = state.packingTypes.find(pk=>pk.name.toLowerCase()===packingName.toLowerCase());
      if(!packing){ errors.push(`Dòng ${rowNum}: không tìm thấy quy cách "${packingName}"`); return; }
    }

    const packQty = parseVNNumber(packQtyRaw);
    const packPrice = parseVNNumber(packPriceRaw);
    if(isNaN(packQty) || packQty<=0){ errors.push(`Dòng ${rowNum}: số lượng "${packQtyRaw}" không hợp lệ`); return; }
    if(isNaN(packPrice) || packPrice<0){ errors.push(`Dòng ${rowNum}: đơn giá "${packPriceRaw}" không hợp lệ`); return; }

    let customerId = null;
    if(custCode){
      const cust = state.customers.find(c=>(c.code||'').toLowerCase()===custCode.toLowerCase());
      if(!cust){ errors.push(`Dòng ${rowNum}: không tìm thấy mã khách hàng "${custCode}"`); return; }
      customerId = cust.id;
    }

    const qtyKg = packing ? packQty * packing.kg : packQty;
    const pricePerKg = packing ? packPrice / packing.kg : packPrice;

    state.productTx.push({id: uid(), productId: product.id, type:'out', qty: qtyKg, date, note, source:'manual', customerId, packingId: packing?packing.id:null, packQty: packing?packQty:null, price: pricePerKg});
    added++;
  });

  importSalesResult = { added, skipped, errors };
  saveState(); render();
}

function doImport(){
  const text = document.getElementById('importText').value;
  const type = importType;
  const lines = text.split('\n');
  let added = 0, updated = 0, skipped = 0;
  const errors = [];
  const list = type==='material' ? state.materials : state.products;

  lines.forEach(raw=>{
    const line = raw.trim();
    if(!line){ skipped++; return; }
    let parts = line.split('\t');
    if(parts.length < 2) parts = line.split(',');
    if(parts.length < 2) parts = line.split(/\s{2,}/);
    const name = (parts[0]||'').trim();
    const unit = (parts[1]||'').trim();
    if(!name){ errors.push(line.slice(0,20)); return; }
    const existing = list.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(existing){
      if(unit) existing.unit = unit;
      updated++;
    } else {
      list.push({id: uid(), name, unit: unit||'—'});
      added++;
    }
  });

  importResult = { added, updated, skipped, errors };
  saveState(); render();
}

function addMaterial(monthStart){
  const name = document.getElementById('newMatName').value.trim();
  const unit = document.getElementById('newMatUnit').value.trim();
  if(!name){ alert('Nhập tên nguyên vật liệu.'); return; }
  const noteEl = document.getElementById('newMatNote');
  const priceEl = document.getElementById('newMatPrice');
  let price = 0;
  if(priceEl && priceEl.value.trim()){
    const p = parseVNNumber(priceEl.value);
    if(isNaN(p)){ alert('Đơn giá không hợp lệ.'); return; }
    price = p;
  }
  const minEl = document.getElementById('newMatMin');
  let minStock = 0;
  if(minEl && minEl.value.trim()){
    const mn = parseVNNumber(minEl.value);
    if(isNaN(mn)){ alert('Tồn tối thiểu không hợp lệ.'); return; }
    minStock = mn;
  }
  const fullNameEl = document.getElementById('newMatFullName');
  const fullName = fullNameEl ? fullNameEl.value.trim() : '';
  const newMat = {id: uid(), name, fullName, unit: unit||'—', note: noteEl ? noteEl.value.trim() : '', price, minStock};
  state.materials.push(newMat);
  const openingEl = document.getElementById('newMatOpening');
  if(openingEl && openingEl.value.trim() && monthStart){
    const qty = parseVNNumber(openingEl.value);
    if(isNaN(qty)){ alert('Tồn đầu không hợp lệ — đã thêm NVL nhưng chưa ghi tồn đầu.'); }
    else applyOpeningAdjustment(newMat.id, monthStart, qty);
  }
  saveState(); render();
}
function saveInlineMaterial(id, monthStart){
  const name = document.getElementById('matNameEdit_'+id).value.trim();
  const unit = document.getElementById('matUnitEdit_'+id).value.trim();
  if(!name){ alert('Nhập tên nguyên vật liệu.'); return; }
  const note = document.getElementById('matNoteEdit_'+id).value.trim();
  const priceInput = document.getElementById('matPriceEdit_'+id);
  const price = parseVNNumber(priceInput.value);
  if(isNaN(price) || price<0){ alert('Đơn giá không hợp lệ.'); return; }
  const minInput = document.getElementById('matMinEdit_'+id);
  const minStock = parseVNNumber(minInput.value);
  if(isNaN(minStock) || minStock<0){ alert('Tồn tối thiểu không hợp lệ.'); return; }
  const openingInput = document.getElementById('openEdit_'+id);
  let adjustmentMsg = '';
  if(openingInput){
    const target = parseVNNumber(openingInput.value);
    if(isNaN(target)){ alert('Tồn đầu không hợp lệ.'); return; }
    const result = applyOpeningAdjustment(id, monthStart, target);
    if(Math.abs(result.diff) > 1e-9){
      const matName = name || (state.materials.find(x=>x.id===id)||{}).name || '';
      adjustmentMsg = `Chênh lệch NVL "${matName}":\nSổ sách tính ra: ${fmt(result.baseWithoutAdj)}\nKiểm kho thực tế: ${fmt(target)}\n→ ${result.diff>0?`Thiếu hụt trong sổ sách — đã tự động ghi nhận thêm +${fmt(result.diff)}`:`Hao hụt/thất thoát so với sổ sách — đã tự động trừ bớt ${fmt(Math.abs(result.diff))}`} (kg), tính đến ngày ${isoToVN(dayBefore(monthStart))}.`;
    }
  }
  const fullNameInput = document.getElementById('matFullNameEdit_'+id);
  const fullName = fullNameInput ? fullNameInput.value.trim() : '';
  const m = state.materials.find(x=>x.id===id);
  if(m){ m.name = name; m.fullName = fullName; m.unit = unit||'—'; m.note = note; m.price = price; m.minStock = minStock; }
  editing.material = null;
  if(adjustmentMsg) alert(adjustmentMsg);
  saveState(); render();
}
function isMaterialUsed(id){
  return state.nvlTx.some(t=>t.materialId===id) ||
    Object.values(state.bom).some(lines=>lines.some(l=>l.materialId===id));
}
function materialUsageDetail(id){
  const txCount = state.nvlTx.filter(t=>t.materialId===id).length;
  const txDates = state.nvlTx.filter(t=>t.materialId===id).map(t=>t.date).sort();
  const bomProducts = Object.keys(state.bom).filter(pid=>state.bom[pid].some(l=>l.materialId===id)).map(productName);
  const parts = [];
  if(txCount) parts.push(`${txCount} giao dịch NVL (từ ${txDates[0]} đến ${txDates[txDates.length-1]})`);
  if(bomProducts.length) parts.push(`định mức của: ${bomProducts.join(', ')}`);
  return parts.join(' và ');
}

function saveInlineProduct(id, monthStart){
  const name = document.getElementById('prodNameEdit_'+id).value.trim();
  const unit = document.getElementById('prodUnitEdit_'+id).value.trim();
  if(!name){ alert('Nhập tên sản phẩm.'); return; }
  const note = document.getElementById('prodNoteEdit_'+id).value.trim();
  const priceInput = document.getElementById('prodPriceEdit_'+id);
  const price = parseVNNumber(priceInput.value);
  if(isNaN(price) || price<0){ alert('Đơn giá bán không hợp lệ.'); return; }
  const packSel = document.getElementById('prodPackingEdit_'+id);
  const defaultPackingId = packSel ? (packSel.value || null) : null;
  const rawOpeningInput = document.getElementById('openProdRawEdit_'+id);
  let adjustmentMsgs = [];
  if(rawOpeningInput && monthStart){
    for(const pk of state.packingTypes){
      const packInput = document.getElementById('openProdPackEdit_'+id+'_'+pk.id);
      if(!packInput) continue;
      const targetPackQty = parseVNNumber(packInput.value);
      if(isNaN(targetPackQty)){ alert(`Tồn đầu "${pk.name}" không hợp lệ.`); return; }
      const result = applyProductPackingOpeningAdjustment(id, pk.id, monthStart, targetPackQty, pk.kg);
      if(Math.abs(result.diff) > 1e-9){
        adjustmentMsgs.push(`${pk.name}: sổ sách ${fmt(result.baseWithoutAdj)} → kiểm kho thực tế ${fmt(targetPackQty)} (${result.diff>0?'+':''}${fmt(result.diff)})`);
      }
    }
    const targetRawKg = parseVNNumber(rawOpeningInput.value);
    if(isNaN(targetRawKg)){ alert('Kg lẻ tồn đầu không hợp lệ.'); return; }
    const rawResult = applyProductRawOpeningAdjustment(id, monthStart, targetRawKg);
    if(Math.abs(rawResult.diff) > 1e-9){
      adjustmentMsgs.push(`Kg lẻ: sổ sách ${fmt(rawResult.baseWithoutAdj)} → kiểm kho thực tế ${fmt(targetRawKg)} (${rawResult.diff>0?'+':''}${fmt(rawResult.diff)})`);
    }
  }
  const adjustmentMsg = adjustmentMsgs.length ? `Chênh lệch tồn đầu thành phẩm "${name}" (tính đến ngày ${isoToVN(dayBefore(monthStart))}):\n${adjustmentMsgs.join('\n')}` : '';
  const p = state.products.find(x=>x.id===id);
  if(p){ p.name = name; p.unit = unit||'—'; p.note = note; p.price = price; p.defaultPackingId = defaultPackingId; }
  editing.product = null;
  if(adjustmentMsg) alert(adjustmentMsg);
  saveState(); render();
}
function isProductUsed(id){
  return state.productTx.some(t=>t.productId===id) || state.orders.some(o=>o.productId===id) || !!(state.bom[id] && state.bom[id].length);
}
function deleteProduct(id){
  if(isProductUsed(id)){ alert('Không thể xoá: sản phẩm đang có giao dịch, lệnh sản xuất hoặc định mức.'); return; }
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(!confirm('Xoá sản phẩm "'+p.name+'"? Thao tác này không thể hoàn tác.')) return;
  state.products = state.products.filter(x=>x.id!==id);
  delete state.bom[id];
  if(bomSelectedProduct===id) bomSelectedProduct = null;
  if(editing.product===id) editing.product = null;

}
function bomChangeDateIso(){

function bulkFixBomHistoryDate(){
  const fromIso = vnToIso(document.getElementById('bomHistBulkFrom').value);
  const toIso = vnToIso(document.getElementById('bomHistBulkTo').value);
  if(!fromIso || !toIso){ alert('Nhập đủ 2 ngày hợp lệ (dd/mm/yyyy).'); return; }
  const allProducts = document.getElementById('bomHistBulkAllProducts').checked;
  let count = 0;
  (state.bomHistory||[]).forEach(h=>{
    if(h.date===fromIso && (allProducts || h.productId===bomSelectedProduct)){
      h.date = toIso;
      count++;
    }
  });
  if(count===0){ alert('Không tìm thấy dòng lịch sử nào ở ngày đó'+(allProducts?'.':' cho sản phẩm này (tick "Áp dụng cho tất cả sản phẩm" nếu muốn tìm ở sản phẩm khác).')); return; }
  saveState(); render();
  alert(`Đã sửa ${count} dòng lịch sử sang ngày ${isoToVN(toIso)}.`);
}
function getBomBatchSize(productId){
  return Number(state.bomBatchSize[productId]) || 1;
}
function normalizeBomBatch(productId){
  const lines = state.bom[productId] || [];
  if(!lines.length) return;
  const batch = getBomBatchSize(productId);
  const totalKg = lines.reduce((s,l)=>s+Number(l.qty||0),0) * batch;
  if(!totalKg) return;
  if(!confirm('Đặt cỡ mẻ gốc = '+fmt(totalKg)+'kg và giữ nguyên số kg từng dòng NVL? Tỷ lệ định mức sẽ được chia lại cho tổng = 1.')) return;
  const changeDate = bomChangeDateIso();
  lines.forEach(l=>{
    const newQty = (l.qty*batch)/totalKg;
    if(Math.abs(newQty-l.qty)>1e-12) logBomChange(productId, l.materialId, l.qty, newQty, null, changeDate);
    l.qty = newQty;
  });
  state.bomBatchSize[productId] = totalKg;
  saveState(); render();
}
function saveBomBatchSize(){
  if(!bomSelectedProduct) return;
  const val = parseVNNumber(document.getElementById('bomBatchSizeInput').value);
  if(!val || val<=0){ alert('Nhập cỡ mẻ hợp lệ (số kg > 0).'); return; }
  state.bomBatchSize[bomSelectedProduct] = val;
  saveState(); render();
}
function addBomLine(){
  if(!bomSelectedProduct) return;
  const batchSize = getBomBatchSize(bomSelectedProduct);
  const enteredQty = parseVNNumber(document.getElementById('bomQty').value);
  if(!enteredQty || enteredQty<=0){ alert('Nhập định mức hợp lệ.'); return; }
  const qty = enteredQty / batchSize;
  if(!state.bom[bomSelectedProduct]) state.bom[bomSelectedProduct] = [];
  const materialId = document.getElementById('bomMatSelect').value;
  if(!materialId){ alert('Chọn NVL.'); return; }
  const changeDate = bomChangeDateIso();
  const existing = state.bom[bomSelectedProduct].find(l=>l.materialId===materialId);
  if(existing){
    if(existing.qty !== qty) logBomChange(bomSelectedProduct, materialId, existing.qty, qty, null, changeDate);
    existing.qty = qty;
  } else {
    state.bom[bomSelectedProduct].push({materialId, qty});
    logBomChange(bomSelectedProduct, materialId, null, qty, null, changeDate);
  }
  saveState(); render();
}
function saveInlineBomLine(materialId){
  const batchSize = getBomBatchSize(bomSelectedProduct);
  const input = document.getElementById('bomQtyEdit_'+materialId);
  const enteredQty = parseVNNumber(input.value);
  if(isNaN(enteredQty) || enteredQty<0){ alert('Định mức không hợp lệ.'); return; }
  const qty = enteredQty / batchSize;
  const selectEl = document.getElementById('bomMatEdit_'+materialId);
  const newMaterialId = selectEl ? selectEl.value : materialId;
  const lines = state.bom[bomSelectedProduct]||[];
  const line = lines.find(l=>l.materialId===materialId);
  if(!line) return;
  const materialChanged = newMaterialId !== materialId;
  if(materialChanged){
    if(lines.some(l=>l.materialId===newMaterialId)){ alert('NVL này đã có trong định mức của sản phẩm này rồi.'); return; }
    line.materialId = newMaterialId;
  }
  if(materialChanged || line.qty !== qty) logBomChange(bomSelectedProduct, newMaterialId, line.qty, qty, materialChanged ? materialId : null, bomChangeDateIso());
  line.qty = qty;
  editing.bomMaterial = null;
  saveState(); render();
}
function deleteBomLine(productId, materialId){
  const line = (state.bom[productId]||[]).find(l=>l.materialId===materialId);
  const matName = materialName(materialId);
  if(!confirm('Xoá dòng định mức NVL "'+matName+'" khỏi sản phẩm "'+productName(productId)+'"?')) return;
  if(line) logBomChange(productId, materialId, line.qty, null, null, bomChangeDateIso());
  state.bom[productId] = (state.bom[productId]||[]).filter(l=>l.materialId!==materialId);
  if(editing.bomMaterial===materialId) editing.bomMaterial = null;
  saveState(); render();
}

function renderTonKho(){
  const yearStart = `${currentYear}-01-01`;

  const ordersThisYear = state.orders.filter(o=>o.date>=yearStart && o.date<yearEndExclusive).length;

  const nvlOutThisYear = state.nvlTx.filter(t=>t.date>=yearStart && t.date<yearEndExclusive && t.type==='out').length;
  const tpInThisYear = state.productTx.filter(t=>t.date>=yearStart && t.date<yearEndExclusive && t.type==='in').length;
  const tpOutThisYear = state.productTx.filter(t=>t.date>=yearStart && t.date<yearEndExclusive && t.type==='out').length;

  const recentOrders = [...state.orders].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,8);
  const recentOrderPackCols = orderPackagingColumns();
  const recentOrderTotalCols = 5 + recentOrderPackCols.length;
  const recentOrderRows = recentOrders.length ? recentOrders.map(o=>`
    <tr>
      <td style="text-align:left;white-space:nowrap">${o.date.split('-').reverse().join('/')}</td>

      ${recentOrderPackCols.map(c=>`<td class="num">${orderColumnValue(o,c.key)}</td>`).join('')}

    </tr>`).join('') : `<tr class="empty-row"><td colspan="${recentOrderTotalCols}">Chưa có lệnh sản xuất nào.</td></tr>`;

  const negNvl = state.materials.map(m=>{
    const inAll = sumTx(state.nvlTx,'materialId',m.id,null,null,'in');
    const outAll = sumTx(state.nvlTx,'materialId',m.id,null,null,'out');
    return {name:m.name, unit:m.unit, stock: inAll-outAll};
  }).filter(x=>x.stock<0).sort((a,b)=>a.stock-b.stock);
  const negTp = state.products.map(p=>{
    const inAll = sumTx(state.productTx,'productId',p.id,null,null,'in');
    const outAll = sumTx(state.productTx,'productId',p.id,null,null,'out');
    return {name:p.name, unit:p.unit, stock: inAll-outAll};
  }).filter(x=>x.stock<0).sort((a,b)=>a.stock-b.stock);
  const lowNvl = state.materials.map(m=>{
    const inAll = sumTx(state.nvlTx,'materialId',m.id,null,null,'in');
    const outAll = sumTx(state.nvlTx,'materialId',m.id,null,null,'out');
    return {name:m.name, unit:m.unit, stock: inAll-outAll, min: Number(m.minStock||0)};
  }).filter(x=>x.stock>=0 && x.min>0 && x.stock<=x.min).sort((a,b)=>a.stock-b.stock);
  const warningRows = (negNvl.length+negTp.length+lowNvl.length) ? [
      ...negNvl.map(x=>`<tr><td>NVL — Âm kho</td><td>${esc(x.name)}</td><td class="num neg">${fmt(x.stock)} ${esc(x.unit)}</td></tr>`),
      ...negTp.map(x=>`<tr><td>Thành phẩm — Âm kho</td><td>${esc(x.name)}</td><td class="num neg">${fmt(x.stock)} ${esc(x.unit)}</td></tr>`),
      ...lowNvl.map(x=>`<tr><td>NVL — Sắp hết</td><td>${esc(x.name)}</td><td class="num" style="color:#9A5B0E;font-weight:700">${fmt(x.stock)} ${esc(x.unit)} <span style="font-weight:400;color:var(--muted)">(tối thiểu ${fmt(x.min)})</span></td></tr>`)
    ].join('') : `<tr class="empty-row"><td colspan="3">Không có cảnh báo — mọi tồn kho đều hợp lệ.</td></tr>`;

  const totalNvlValue = state.materials.reduce((sum,m)=>{
    const inAll = sumTx(state.nvlTx,'materialId',m.id,null,null,'in');
    const outAll = sumTx(state.nvlTx,'materialId',m.id,null,null,'out');
    return sum + (inAll-outAll) * computeAvgPrice(m).value;
  }, 0);
  const totalTpValue = state.productSkus.reduce((sum,s)=>{
    return sum + skuAllTimeClosing(s) * Number(s.price||0);
  }, 0) + state.products.reduce((sum,p)=>{
    return sum + productRawKgAllTimeClosing(p.id) * currentPrice(p.id, todayStr());
  }, 0);

  const plRows = state.products.map(p=>{
    const sales = state.productTx.filter(t=>t.productId===p.id && t.type==='out' && t.source!=='recycle_input' && t.source!=='opening_adjust' && t.source!=='repack_auto');
    const soldQty = sales.reduce((s,t)=>s+Number(t.qty||0),0);
    const revenue = sales.reduce((s,t)=>s+Number(t.qty||0)*Number(t.price!=null?t.price:currentPrice(p.id, t.date)),0);
    const unitCost = computeProductCost(p.id);
    const cogs = soldQty * unitCost;
    const profit = revenue - cogs;
    const margin = revenue>0 ? (profit/revenue*100) : null;
    return {name:p.name, unit:p.unit, soldQty, revenue, unitCost, cogs, profit, margin};
  }).filter(x=>x.soldQty>0).sort((a,b)=>b.profit-a.profit);
  const plTotals = plRows.reduce((t,x)=>({revenue:t.revenue+x.revenue, cogs:t.cogs+x.cogs, profit:t.profit+x.profit}), {revenue:0,cogs:0,profit:0});

      <td class="num">${fmtM(x.cogs)}</td>
      <td class="num" style="font-weight:700;color:${x.profit<0?'#9C3F2B':'#2E6B37'}">${fmtM(x.profit)}</td>
      <td class="num">${x.margin===null?'—':fmt1(x.margin)+'%'}</td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="7">Chưa có sản phẩm nào được bán (xuất kho loại "Xuất kho (bán)").</td></tr>`;
  const plTotalRow = plRows.length ? `<tr style="font-weight:700;border-top:2px solid var(--line)">
      <td colspan="2">TỔNG CỘNG</td>
      <td class="num">${fmtM(plTotals.revenue)}</td>
      <td></td>
      <td class="num">${fmtM(plTotals.cogs)}</td>
      <td class="num" style="color:${plTotals.profit<0?'#9C3F2B':'#2E6B37'}">${fmtM(plTotals.profit)}</td>
      <td class="num">${plTotals.revenue>0?fmt1(plTotals.profit/plTotals.revenue*100)+'%':'—'}</td>
    </tr>` : '';

  return `
  <div class="stat-cards">
    <div class="stat-card accent-order"><div class="stat-value">${ordersThisYear}</div><div class="stat-label">Lệnh SX — năm ${currentYear}</div></div>
    <div class="stat-card accent-nvl">

        <span style="color:#2E6B37">${nvlInThisYear} nhập</span><span style="color:var(--muted);font-size:13px">/</span><span style="color:#9C3F2B">${nvlOutThisYear} xuất</span>

        <span style="color:#2E6B37">${tpInThisYear} nhập</span><span style="color:var(--muted);font-size:13px">/</span><span style="color:#9C3F2B">${tpOutThisYear} xuất</span>
      </div>
      <div class="stat-label">Số phiếu TP — năm ${currentYear}</div>
    </div>
    <div class="stat-card accent-nvl"><div class="stat-value" style="font-size:20px">${fmt(totalNvlValue)}</div><div class="stat-label">Giá trị tồn kho NVL</div></div>

      <table class="tbl-tp bh-fit"><colgroup><col style="width:24%"><col style="width:13%"><col style="width:15%"><col style="width:12%"><col style="width:15%"><col style="width:13%"><col style="width:8%"></colgroup>

      <td class="num" style="font-weight:600">${fmt(o.qty)}</td>
      <td class="num">${fmt(orderNvlCost(o.id))}</td>
      <td>${isOrderLocked(o.id)?'<span title="Lệnh đã chốt — không sửa/xoá được, bấm 🔓 để mở khoá" style="color:#B9601E;font-weight:600">🔒 </span>':''}${esc(o.note||'')}</td>
      <td class="num row-actions"><button class="btn-edit" onclick="toggleOrderDetail('${o.id}')" title="Xem chi tiết NVL">👁</button>${isOrderLocked(o.id)
        ? `<button class="btn-edit" onclick="toggleOrderLock('${o.id}')" title="Mở khoá lệnh để sửa">🔓</button>`
        : `<button class="btn-edit" onclick="startEditOrder('${o.id}')" title="Sửa">✎</button><button class="btn-edit" onclick="toggleOrderLock('${o.id}')" title="Chốt lệnh (khoá không cho sửa/xoá)">🔒</button><button class="btn-del" onclick="deleteOrder('${o.id}')">✕</button>`}</td>
    </tr>${(viewingOrderDetail===o.id||orderPending(o)) ? renderOrderDetailRow(o,totalCols) : ''}`).join('') : `<tr class="empty-row"><td colspan="${totalCols}">Chưa có lệnh sản xuất trong ${monthLabel(month).toLowerCase()}.</td></tr>`;

  const editingOrder = editing.order ? state.orders.find(o=>o.id===editing.order) : null;
  orderFormBaseTotal = editingOrder ? editingOrder.qty : 0;
  const prodOptions = state.products.map(p=>`<option value="${p.id}" ${editingOrder && editingOrder.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');

  return `
  <div class="panel">
    <div class="panel-head head-order"><h2><span class="idx">SX</span>${monthLabel(month)} — Lệnh sản xuất</h2></div>
    <div class="panel-body">
      ${state.products.length ? `
      ${!editingOrder ? `<button type="button" class="btn" style="margin-bottom:14px" onclick="orderExtraLines=[]; editing.orderExtraLineIdx=null; toggleForm('addOrder')">+ Tạo mới lệnh sản xuất ${panelToggles.addOrder?'▴':'▾'}</button>` : ''}
      ${month!==0 ? `<button type="button" class="btn-ghost" style="margin-bottom:14px;margin-left:8px;font-size:12px;padding:8px 12px;border-radius:5px" onclick="toggleMonthLock(${currentYear},${month})" title="${isMonthLocked(currentYear+'-'+pad(month)+'-01')?'Mở khoá tháng này':'Khoá toàn bộ lệnh trong tháng, không tạo/sửa/xoá được nữa'}">${isMonthLocked(currentYear+'-'+pad(month)+'-01')?'🔓 Mở khoá tháng '+month:'🔒 Chốt cả tháng '+month}</button>${isMonthLocked(currentYear+'-'+pad(month)+'-01')?`<span style="margin-left:8px;font-size:12px;color:#B9601E;font-weight:600">🔒 Tháng ${month}/${currentYear} đã chốt sổ</span>`:''}` : ''}
      ${(panelToggles.addOrder || editingOrder) ? `
      <form class="inline-form" style="margin-bottom:16px" onsubmit="event.preventDefault(); addOrder(${month});">
        <div class="form-title">${editingOrder?'✎ Sửa lệnh sản xuất<span class="editing-badge">Đang sửa</span>':'+ Tạo lệnh sản xuất mới'}</div>
        <div class="field grow"><label>Sản phẩm</label><select id="ordProduct" onchange="updateOrderPreview()">${prodOptions}</select></div>
        <div class="field"><label>Ngày</label><input id="ordDate" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" style="width:110px" oninput="formatDateInput(this)" value="${isoToVN(editingOrder?editingOrder.date:clampToday(monthStart, monthEndExclusive))}"></div>
        <div class="field grow"><label>Ghi chú</label><input id="ordNote" type="text" placeholder="Tuỳ chọn" value="${editingOrder?esc(editingOrder.note||''):''}"></div>
        <div class="field grow" style="flex-basis:100%">
          <label>Số lượng sản xuất — nhập theo quy cách, hệ thống tự cộng ra kg</label>
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:4px">
            ${state.packingTypes.map(pk=>`
            <div style="display:flex;flex-direction:column;gap:3px">
              <span style="font-size:11px;color:var(--muted)">${esc(pk.name)}</span>
              <input id="ordPack_${pk.id}" type="text" inputmode="decimal" style="width:80px" placeholder="0" value="${orderPackQtyFor(editingOrder,pk.id)}" oninput="onPackFieldChange()">
            </div>`).join('')}
            <div style="display:flex;flex-direction:column;gap:3px">
              <span style="font-size:11px;color:var(--muted)">Kg lẻ (không đóng gói)</span>
              <input id="ordRawKg" type="text" inputmode="decimal" style="width:90px" placeholder="0" value="${orderRawKgFor(editingOrder)}" oninput="onRawKgFieldChange()">
            </div>
            <div style="display:flex;flex-direction:column;gap:3px">
              <span style="font-size:11px;color:var(--muted)">Tổng cộng <span style="color:#B9601E">(bấm để kiểm tra NVL)</span></span>
              <div id="ordQtyTotal" onclick="checkNvlAvailability()" title="Bấm để kiểm tra tồn NVL có đủ không" style="font-weight:700;padding:6px 10px;cursor:pointer;background:#FFF3D9;border:1px solid #E8C878;border-radius:6px;display:inline-block">🔍 ${editingOrder?fmt(editingOrder.qty)+' kg':'0 kg'}</div>
            </div>
          </div>
          <div id="ordQtyBreakdown" style="font-size:11px;color:var(--muted);margin-top:6px">${editingOrder?qtyBreakdownText(state.packingTypes.map(pk=>({packingId:pk.id, packQty: parseVNNumber(orderPackQtyFor(editingOrder,pk.id))||0})), parseVNNumber(orderRawKgFor(editingOrder))||0):''}</div>
          <div id="ordQtyExceedWarning" style="font-size:12px;color:#9C3F2B;font-weight:600;margin-top:6px"></div>
          <p class="section-note" style="margin-top:4px">Nhập số thùng/can sẽ tự trừ vào "Kg lẻ" để giữ nguyên tổng sản lượng (không cộng dồn, không tăng NVL) — chỉ khi bạn tự sửa ô "Kg lẻ" thì tổng mới thay đổi. Nếu đóng gói vượt quá tổng ban đầu, hệ thống sẽ cảnh báo để bạn thêm NVL phát sinh nếu cần.</p>
        </div>
        ${renderOrderExtraLinesSection()}
        <button type="submit" class="btn">${editingOrder?'Cập nhật':'+ Tạo lệnh sản xuất'}</button>
        ${editingOrder?`<button type="button" class="btn-cancel-edit" onclick="orderExtraLines=[]; editing.orderExtraLineIdx=null; cancelEdit('order')">Huỷ</button>`:''}
      </form>
      <div id="orderPreview"></div>
      <p class="section-note" style="margin-top:10px">Khi tạo lệnh: thành phẩm tự nhập kho, NVL tự xuất kho theo định mức đã khai báo.</p>
      ` : ''}` : `<p class="section-note">Hãy khai báo sản phẩm ở tab "Kho thành phẩm" trước.</p>`}

      <div style="text-align:right;margin-bottom:8px"><button type="button" class="btn-ghost" style="font-size:12px;padding:5px 10px;border-radius:5px" onclick="exportTableById('orderTable','lenh-san-xuat-${monthLabel(month).replace(' ','-')}-${currentYear}.csv')">⇩ Xuất CSV</button></div>
      <div style="overflow-x:auto"><table class="tbl-order" id="orderTable">
        <thead><tr><th style="width:100px">Ngày</th><th style="width:90px">Sản phẩm</th>${packCols.map(c=>`<th style="text-align:right;width:58px">${esc(c.label)}</th>`).join('')}<th style="text-align:right;width:85px">Tổng (kg)</th><th style="text-align:right;width:110px">Giá trị NVL</th><th style="width:150px">Ghi chú</th><th class="row-actions" style="width:100px"></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
