}

function getOrderQtyBreakdown(){
  const packLines = state.packingTypes.map(pk=>{
    const el = document.getElementById('ordPack_'+pk.id);
    const n = el && el.value.trim() ? parseVNNumber(el.value) : 0;
    const packQty = isNaN(n) || n<0 ? 0 : n;
    return {packingId: pk.id, packQty, kg: packQty * pk.kg};
  }).filter(l=>l.packQty>0);
  const rawEl = document.getElementById('ordRawKg');
  const rawN = rawEl && rawEl.value.trim() ? parseVNNumber(rawEl.value) : 0;
  const rawKg = isNaN(rawN) || rawN<0 ? 0 : rawN;
  const totalQty = Math.round((packLines.reduce((s,l)=>s+l.kg,0) + rawKg)*1000)/1000;
  return {packLines, rawKg, totalQty};
}
function qtyBreakdownText(packLines, rawKg){
  const parts = packLines.filter(l=>l.packQty>0).map(l=>`${fmt(l.packQty)} ${packingLabel(l.packingId)}`);
  if(rawKg>0) parts.push(`${fmt(rawKg)} kg lẻ`);
  return parts.length ? 'Gồm: ' + parts.join(' + ') : '';
}
function updateOrderQtyTotal(){
  const {totalQty, packLines, rawKg} = getOrderQtyBreakdown();
  const totalEl = document.getElementById('ordQtyTotal');
  if(totalEl) totalEl.textContent = '🔍 '+fmt(totalQty)+' kg';
  const breakdownEl = document.getElementById('ordQtyBreakdown');
  if(breakdownEl) breakdownEl.textContent = qtyBreakdownText(packLines, rawKg);
  const warningEl = document.getElementById('ordQtyExceedWarning');
  if(warningEl){
    const diff = Math.round((totalQty - orderFormBaseTotal)*1000)/1000;
    warningEl.textContent = (editing.order && diff>0.001) ? `⚠ Đóng gói đã vượt ${fmt(diff)}kg so với tổng SX ban đầu (${fmt(orderFormBaseTotal)}kg) — kiểm tra lại, có thể cần thêm NVL phát sinh cho phần dư này ở khung bên dưới.` : '';
  }
  updateOrderPreview();
}
function packagedKgFromFields(){
  return state.packingTypes.reduce((s,pk)=>{
    const el = document.getElementById('ordPack_'+pk.id);
    const n = el && el.value.trim() ? parseVNNumber(el.value) : 0;
    return s + (isNaN(n)||n<0?0:n)*pk.kg;
  },0);
}
function onPackFieldChange(){
  const packagedKg = packagedKgFromFields();
  const rawEl = document.getElementById('ordRawKg');
  if(rawEl){
    const remainder = Math.round((orderFormBaseTotal - packagedKg)*1000)/1000;
    rawEl.value = remainder>0 ? remainder : '';
  }
  updateOrderQtyTotal();
}
function onRawKgFieldChange(){
  orderFormBaseTotal = getOrderQtyBreakdown().totalQty;
  updateOrderQtyTotal();
}
function checkNvlAvailability(){
  updateOrderPreview();
  const el = document.getElementById('orderPreview');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function updateOrderPreview(){
  const el = document.getElementById('orderPreview');
  const prodEl = document.getElementById('ordProduct');
  if(!el || !prodEl) return;
  const productId = prodEl.value;
  const qty = getOrderQtyBreakdown().totalQty;
  if(!productId || !qty || qty<=0){ el.innerHTML = ''; return; }
  const dateEl = document.getElementById('ordDate');
  const orderDate = dateEl ? vnToIso(dateEl.value) : null;
  const asOfExclusive = orderDate ? monthEndExclusiveFor(orderDate) : null;
  let stockNote = orderDate ? `hiện tại tháng ${Number(orderDate.slice(5,7))}/${orderDate.slice(0,4)}` : 'hiện tại';
  if(editing.order){
    const excludeIds = new Set(state.nvlTx.filter(t=>t.orderId===editing.order).map(t=>t.id));
    var nvlTxForCheck = state.nvlTx.filter(t=>!excludeIds.has(t.id));
    const excludeProdIds = new Set(state.productTx.filter(t=>t.orderId===editing.order).map(t=>t.id));
    var productTxForCheck = state.productTx.filter(t=>!excludeProdIds.has(t.id));
  } else {
    var nvlTxForCheck = state.nvlTx;
    var productTxForCheck = state.productTx;
  }
  const bomLines = state.bom[productId] || [];
  if(!bomLines.length && !orderExtraLines.length){
    el.innerHTML = `<p class="section-note" style="margin-top:10px">Sản phẩm này chưa có định mức — lệnh sẽ chỉ nhập kho thành phẩm, không trừ NVL nào.</p>`;
    return;
  }
  let totalCost = 0;
  const rows = bomLines.map(l=>{
    const need = l.qty*qty;
    const stock = openingStock(nvlTxForCheck, 'materialId', l.materialId, asOfExclusive);
    const short = stock - need < 0;
    const mat = state.materials.find(m=>m.id===l.materialId);
    const price = mat ? computeAvgPrice(mat, orderDate||undefined).value : 0;
    const cost = need * price;
    totalCost += cost;
    return `<tr>
      <td>${esc(materialName(l.materialId))}</td>
      <td class="num">${fmt(need)} ${esc(materialUnit(l.materialId))}</td>
      <td class="num">${fmt(stock)} ${esc(materialUnit(l.materialId))}</td>
      <td class="num" style="color:${short?'#c0392b':'#2e7d32'};font-weight:600">${short?'Thiếu '+fmt(need-stock):'Đủ'}</td>
      <td class="num">${fmt(cost)}</td>
    </tr>`;
  }).join('');
  const extraRows = orderExtraLines.map(l=>{
    const need = l.qty;
    if(l.type==='material'){
      const stock = openingStock(nvlTxForCheck, 'materialId', l.itemId, asOfExclusive);
      const short = stock - need < 0;
      const mat = state.materials.find(m=>m.id===l.itemId);
      const price = mat ? computeAvgPrice(mat, orderDate||undefined).value : 0;
      const cost = need * price;
      totalCost += cost;
      return `<tr>
        <td>${esc(materialName(l.itemId))} <span style="font-size:10px;color:var(--muted)">(phát sinh thêm)</span></td>
        <td class="num">${fmt(need)} ${esc(materialUnit(l.itemId))}</td>
        <td class="num">${fmt(stock)} ${esc(materialUnit(l.itemId))}</td>
        <td class="num" style="color:${short?'#c0392b':'#2e7d32'};font-weight:600">${short?'Thiếu '+fmt(need-stock):'Đủ'}</td>
        <td class="num">${fmt(cost)}</td>
      </tr>`;
    } else {
      const stock = openingStock(productTxForCheck, 'productId', l.itemId, asOfExclusive);
      const short = stock - need < 0;
      const price = currentPrice(l.itemId, orderDate||todayStr());
      const cost = need * price;
      totalCost += cost;
      return `<tr>
        <td>${esc(productName(l.itemId))} <span style="font-size:10px;color:var(--muted)">(SP tái chế)</span></td>
        <td class="num">${fmt(need)} ${esc(productUnit(l.itemId))}</td>
        <td class="num">${fmt(stock)} ${esc(productUnit(l.itemId))}</td>
        <td class="num" style="color:${short?'#c0392b':'#2e7d32'};font-weight:600">${short?'Thiếu '+fmt(need-stock):'Đủ'}</td>
        <td class="num">${fmt(cost)}</td>
      </tr>`;
    }
  }).join('');
  el.innerHTML = `
    <p class="section-note" style="margin-top:10px">NVL/SP tái chế sẽ xuất kho, với số lượng SX = ${fmt(qty)} kg — <strong>ước tính giá trị: ${fmt(totalCost)}</strong> (theo đơn giá bình quân):</p>
    <table class="tbl-bom">
      <thead><tr><th>Nguyên vật liệu / Sản phẩm</th><th style="text-align:right;width:110px">Cần dùng</th><th style="text-align:right;width:110px">Tồn (${esc(stockNote)})</th><th style="text-align:right;width:100px">Trạng thái</th><th style="text-align:right;width:110px">Thành tiền</th></tr></thead>
      <tbody>${rows}${extraRows}</tbody>
    </table>`;
}
function renderOrderExtraLinesSection(){
  const editingIdx = editing.orderExtraLineIdx;
  const rowsHtml = orderExtraLines.map((l,idx)=>{
    const name = l.type==='material' ? materialName(l.itemId) : (productName(l.itemId)+' (SP tái chế)');
    const unit = l.type==='material' ? materialUnit(l.itemId) : productUnit(l.itemId);
    if(editingIdx===idx){
      return `<tr>
      <td>${esc(name)}</td>
      <td class="num"><input id="orderExtraQtyEdit_${idx}" type="text" value="${fmt(l.qty)}" style="width:90px;text-align:right"></td>
      <td class="num row-actions"><button type="button" class="btn-edit" onclick="saveOrderExtraLineQty(${idx})" title="Lưu">✔</button><button type="button" class="btn-del" onclick="cancelOrderExtraLineEdit()" title="Huỷ">✕</button></td>
    </tr>`;
    }
    return `<tr>
      <td>${esc(name)}</td>
      <td class="num">${fmt(l.qty)} ${esc(unit)}</td>
      <td class="num row-actions"><button type="button" class="btn-edit" onclick="startEditOrderExtraLine(${idx})" title="Sửa">✎</button><button type="button" class="btn-del" onclick="removeOrderExtraLine(${idx})" title="Xoá">✕</button></td>
    </tr>`;
  }).join('');
  const matOpts = sortedMaterials().map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.unit)})</option>`).join('');
  const prodOpts = state.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.unit)})</option>`).join('');
  return `
    <div class="field grow" style="flex-basis:100%;margin-top:10px;padding:12px;background:#FBF6EC;border:1px solid #E8D9AE;border-radius:8px">
      <div style="font-weight:600;margin-bottom:4px">NVL / SP tái chế phát sinh thêm (nhập tay, không theo định mức)</div>
      <p class="section-note" style="margin-top:0">Dùng khi cần thêm NVL ngoài định mức trong lúc sản xuất (điều chỉnh tuỳ mẻ, tuỳ độ nhớt...) hoặc khi tái chế thành phẩm cũ — không tính theo định mức cố định, nhập đúng số lượng thực tế đã dùng cho lệnh này.</p>
      ${orderExtraLines.length ? `
      <table class="tbl-bom" style="width:auto;min-width:360px;margin-bottom:10px">
        <thead><tr><th>Mục</th><th style="text-align:right;width:110px">Số lượng</th><th style="width:70px"></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field grow"><label>+ NVL</label><select id="extraMatSelect">${matOpts}</select></div>
        <div class="field"><label>Số lượng</label><input id="extraMatQty" type="text" inputmode="decimal" style="width:100px"></div>
        <button type="button" class="btn" onclick="addOrderExtraLine('material')">+ Thêm NVL</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">
        <div class="field grow"><label>+ Sản phẩm tái chế</label><select id="extraProdSelect">${prodOpts}</select></div>
        <div class="field"><label>Số lượng</label><input id="extraProdQty" type="text" inputmode="decimal" style="width:100px"></div>
        <button type="button" class="btn" onclick="addOrderExtraLine('product')">+ Thêm SP</button>
      </div>
    </div>`;
}
function captureOrderFormDraft(){
  const draft = { packs: {} };
  const prodEl = document.getElementById('ordProduct');
  const dateEl = document.getElementById('ordDate');
  const noteEl = document.getElementById('ordNote');
  const rawEl = document.getElementById('ordRawKg');
  if(prodEl) draft.productId = prodEl.value;
  if(dateEl) draft.date = dateEl.value;
  if(noteEl) draft.note = noteEl.value;
  if(rawEl) draft.rawKg = rawEl.value;
  state.packingTypes.forEach(pk=>{
    const el = document.getElementById('ordPack_'+pk.id);
    if(el) draft.packs[pk.id] = el.value;
  });
  return draft;
}
function restoreOrderFormDraft(draft){
  if(!draft) return;
  const prodEl = document.getElementById('ordProduct');
  const dateEl = document.getElementById('ordDate');
  const noteEl = document.getElementById('ordNote');
  const rawEl = document.getElementById('ordRawKg');
  if(prodEl && draft.productId!=null) prodEl.value = draft.productId;
  if(dateEl && draft.date!=null) dateEl.value = draft.date;
  if(noteEl && draft.note!=null) noteEl.value = draft.note;
  if(rawEl && draft.rawKg!=null) rawEl.value = draft.rawKg;
  state.packingTypes.forEach(pk=>{
    const el = document.getElementById('ordPack_'+pk.id);
    if(el && draft.packs[pk.id]!=null) el.value = draft.packs[pk.id];
  });
}
function addOrderExtraLine(type){
  const qtyEl = document.getElementById(type==='material'?'extraMatQty':'extraProdQty');
  const selEl = document.getElementById(type==='material'?'extraMatSelect':'extraProdSelect');
  const qty = parseVNNumber(qtyEl.value);
  if(!qty || qty<=0){ alert('Nhập số lượng hợp lệ.'); return; }
  const itemId = selEl.value;
  if(!itemId){ alert('Chọn mục.'); return; }
  const draft = captureOrderFormDraft();
  orderExtraLines.push({type, itemId, qty});
  render();
  restoreOrderFormDraft(draft);
  updateOrderPreview();
}
function removeOrderExtraLine(idx){
  const draft = captureOrderFormDraft();
  orderExtraLines.splice(idx,1);
  if(editing.orderExtraLineIdx===idx) editing.orderExtraLineIdx = null;
  render();
  restoreOrderFormDraft(draft);
  updateOrderPreview();
}
function startEditOrderExtraLine(idx){
  const draft = captureOrderFormDraft();
  editing.orderExtraLineIdx = idx;
  render();
  restoreOrderFormDraft(draft);
}
function saveOrderExtraLineQty(idx){
  const input = document.getElementById('orderExtraQtyEdit_'+idx);
  const qty = parseVNNumber(input.value);
  if(isNaN(qty) || qty<=0){ alert('Số lượng không hợp lệ.'); return; }
  const draft = captureOrderFormDraft();
  orderExtraLines[idx].qty = qty;
  editing.orderExtraLineIdx = null;
  render();
  restoreOrderFormDraft(draft);
  updateOrderPreview();
}
function cancelOrderExtraLineEdit(){
  const draft = captureOrderFormDraft();
  editing.orderExtraLineIdx = null;
  render();

function isMonthLocked(isoDate){
  return !!isoDate && (state.lockedMonths||[]).includes(String(isoDate).slice(0,7));
}
function isOrderLocked(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  return !!(o && (o.locked || isMonthLocked(o.date)));
}
function toggleMonthLock(year, month){
  const ym = `${year}-${pad(month)}`;
  if(editing.order){ alert('Hãy bấm "Cập nhật" hoặc "Huỷ" để thoát chế độ sửa lệnh trước khi chốt/mở khoá tháng.'); return; }
  const monthOrders = state.orders.filter(o=>o.date.slice(0,7)===ym);
  if(isMonthLocked(ym+'-01')){
    if(!confirm(`Mở khoá tháng ${month}/${year}? Sau khi mở có thể tạo/sửa/xoá lệnh trong tháng này.`)) return;
    state.lockedMonths = state.lockedMonths.filter(x=>x!==ym);
    if(monthOrders.some(o=>o.locked) && confirm(`Mở khoá luôn ${monthOrders.length} lệnh trong tháng ${month}/${year}?\nBấm OK để mở khoá hết, Huỷ để các lệnh vẫn giữ trạng thái đã chốt (mở từng lệnh bằng 🔓 khi cần).`)){
      monthOrders.forEach(o=>{ o.locked = false; });
    }
  } else {
    if(!confirm(`Chốt tháng ${month}/${year}? Toàn bộ ${monthOrders.length} lệnh sẽ bị khoá, và không tạo/sửa/xoá được lệnh có ngày trong tháng này cho tới khi mở khoá tháng.`)) return;
    state.lockedMonths.push(ym);
    monthOrders.forEach(o=>{ o.locked = true; });
    editing.orderDetailTx = null;
  }
  saveState(); render();
}
function toggleOrderLock(orderId){
  const o = state.orders.find(x=>x.id===orderId);

}

function clampToday(monthStart, monthEndExclusive){

  if(t>=monthStart && t<monthEndExclusive) return t;

function addOrder(month){

    orderExtraLines.filter(l=>l.type==='material').forEach(l=>{ needs[l.itemId] = (needs[l.itemId]||0) + l.qty; });

  }

  let preservedExtraNotes = {};
  let preservedRecycleNotes = {};

    if(ord && ord.custom && ord.productId===productId){ customLines = state.nvlTx.filter(t=>t.orderId===orderId && t.source==='production' && t.type==='out').map(t=>({...t})); customRatio = Number(ord.qty)>0 ? qty/Number(ord.qty) : 1; }
    if(ord){ ord.productId = productId; ord.qty = qty; ord.date = date; ord.note = note; }
    state.nvlTx.filter(t=>t.orderId===orderId && t.source==='production').forEach(t=>{ if(t.note) preservedProductionNotes[t.materialId] = t.note; });
    state.nvlTx.filter(t=>t.orderId===orderId && t.source==='manual_extra').forEach(t=>{ if(t.note) preservedExtraNotes[t.materialId] = t.note; });
    state.productTx.filter(t=>t.orderId===orderId && t.source==='recycle_input').forEach(t=>{ if(t.note) preservedRecycleNotes[t.productId] = t.note; });
    state.nvlTx = state.nvlTx.filter(t=>t.orderId!==orderId);
    state.productTx = state.productTx.filter(t=>t.orderId!==orderId);

  } else {

  }

    state.productTx.push({id: uid(), productId, type:'in', qty: l.kg, date, note: note||'Nhập từ sản xuất', source:'production', orderId, packingId: l.packingId, packQty: l.packQty});
  });
  if(rawKg>0){
    state.productTx.push({id: uid(), productId, type:'in', qty: rawKg, date, note: note||'Nhập từ sản xuất', source:'production', orderId, packingId: null, packQty: null});
  }
  const bomLines = state.bom[productId] || [];
  if(customLines && customLines.length){
    customLines.forEach(l=>{ state.nvlTx.push({...l, id: uid(), date, qty: l.qty*customRatio}); });
    { const od2=state.orders.find(o=>o.id===orderId); if(od2) od2.custom=true; }
  } else if(!bomLines.length && !orderExtraLines.length){
    alert('Lưu ý: sản phẩm này chưa có định mức, hệ thống chỉ nhập kho thành phẩm, không trừ NVL.');
  } else {
    bomLines.forEach(l=>{
      state.nvlTx.push({id: uid(), materialId: l.materialId, type:'out', qty: l.qty*qty, date, note: preservedProductionNotes[l.materialId]||'', source:'production', orderId});
    });
  }
  orderExtraLines.forEach(l=>{
    if(l.type==='material'){
      state.nvlTx.push({id: uid(), materialId: l.itemId, type:'out', qty: l.qty, date, note: preservedExtraNotes[l.itemId]||'Phát sinh thêm ngoài định mức', source:'manual_extra', orderId});
    } else {
      state.productTx.push({id: uid(), productId: l.itemId, type:'out', qty: l.qty, date, note: preservedRecycleNotes[l.itemId]||'Tái chế cho lệnh sx '+productName(productId), source:'recycle_input', orderId, packingId: null, packQty: null});
    }
  });
  orderExtraLines = [];
  saveState(); render();
}
function deleteOrder(id){
  if(isOrderLocked(id)){ alert('Lệnh này đã chốt. Bấm 🔓 để mở khoá nếu cần xoá.'); return; }
  if(!confirm('Xoá lệnh sản xuất này? Các giao dịch NVL/thành phẩm liên quan sẽ được hoàn tác.')) return;

}

/* ===== BỘ ĐỌC PHIẾU NCC (không phụ thuộc giao diện) ===== */
function ocrNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(); }
function ocrNum(t){ return Number(String(t).replace(/[.,\s]/g,'')); }
function ocrMoney(line){ const out=[]; const re=/\d{1,3}(?:[.,]\d{3})+|\d{3,}/g; let m; while((m=re.exec(line))) out.push(ocrNum(m[0])); return out; }
function ocrLev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ let c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function ocrKey(s){ return ocrNorm(s).replace(/[^a-z0-9]/g,''); }
function ocrPhuyKg(m){ const r=/(\d+(?:[.,]\d+)?)\s*phuy\s*=\s*(\d+(?:[.,]\d+)?)\s*kg/i.exec(String((m&&m.note)||'')); return r?Number(String(r[2]).replace(',','.')):null; }
/* materials: [{id,name,fullName,note}], suppliers: [{id,name}], aliases: {key:materialId} */
function parseSupplierSlips(text, materials, suppliers, aliases){
  const lines=String(text||'').split(/\r?\n/);
  const nl=lines.map(ocrNorm);
  const dateRe=/(\d{1,2})\s*t\w{2,5}\s*(\d{1,2})\s*n\w{1,3}\s*(20\d\d)/;
  const dates=[]; nl.forEach((l,i)=>{ const m=dateRe.exec(l); if(m && +m[1]>=1 && +m[1]<=31 && +m[2]>=1 && +m[2]<=12) dates.push({i,d:+m[1],m:+m[2],y:+m[3]}); });
  if(!dates.length && nl.some(l=>/gom\s*vat|vat/.test(l))) dates.push({i:-1,d:0,m:0,y:0});
  const generic=new Set('cong ty tnhh tm dv thuong mai dich vu co phan hoa chat san xuat xnk nhap khau'.split(' '));
  const allNorm=nl.join(' ');
  function pickSupplier(){
    let best=null,bs=0;
    (suppliers||[]).forEach(s=>{ const toks=[...new Set(ocrNorm(s.name).split(/[^a-z0-9]+/).filter(t=>t.length>=3&&!generic.has(t)))]; if(!toks.length) return; const m=toks.filter(t=>allNorm.includes(t)).length; const hit=m/toks.length; if(m>=Math.min(2,toks.length)&&hit>bs){bs=hit;best=s;} });
    return bs>=0.6?best:null;
  }
  const sup=pickSupplier();
  const slips=[];
  dates.forEach((dt,k)=>{
    const end=k+1<dates.length?dates[k+1].i:lines.length;
    let totIdx=-1; for(let i=dt.i+1;i<end;i++){ if(/gom\s*vat|tong\s*ti\w{1,2}n\s*g\w{1,2}m|tong\s*cong/.test(nl[i])){ totIdx=i; break; } }
    const stop=totIdx>=0?totIdx:end-1;
    let hangIdx=-1; for(let i=dt.i+1;i<=stop;i++){ if(/tong\s*ti\w{1,2}n\s*h\w{1,2}ng/.test(nl[i])){ hangIdx=i; break; } }
    let vatIdx=-1; for(let i=(hangIdx>=0?hangIdx:dt.i)+1;i<=stop;i++){ if(/vat/.test(nl[i])){ vatIdx=i; break; } }
    const rowEnd=hangIdx>=0?hangIdx-1:stop;
    const rows=[]; for(let i=dt.i+1;i<=rowEnd;i++){ if(/nguoi mua|ma don|tel|dia chi|dien thoai/.test(nl[i])) continue; const mn=ocrMoney(lines[i]); if(mn.length>=2) rows.push({i,mn,raw:lines[i]}); }
    const maxOf=i=>{ if(i<0) return null; const a=ocrMoney(lines[i]); return a.length?Math.max(...a):null; };
    const tHang=maxOf(hangIdx), vat=maxOf(vatIdx), tot=maxOf(totIdx);
    const tAlt=(tot&&vat&&tot>vat)?tot-vat:null;
    const items=[];
    rows.forEach(r=>{
      const T0=Math.max(...r.mn);
      const others=r.mn.filter(x=>x!==T0||r.mn.indexOf(x)!==r.mn.lastIndexOf(x)); 
      const cand=[T0]; if(rows.length===1){ [tHang,tAlt].forEach(x=>{ if(x&&!cand.includes(x)) cand.push(x); }); }
      // chọn T theo số phiếu đồng ý
      let T=T0;
      if(rows.length===1){ const votes={}; [T0,tHang,tAlt].forEach(x=>{ if(x) votes[x]=(votes[x]||0)+1; }); const ranked=Object.entries(votes).sort((a,b)=>b[1]-a[1]); if(ranked.length&&(ranked[0][1]>=2||!votes[T0])) T=Number(ranked[0][0]); else if(tHang) T=tHang; }
      const pc=r.mn.filter(x=>x>=1000&&x<=999999&&x!==T);
      let P=null,kg=null;
      for(const p of pc){ const q=T/p; if(q>=0.5&&Math.abs(q-Math.round(q*1000)/1000)<1e-6){ P=p; kg=Math.round(q*1000)/1000; break; } }
      const qcTok=r.mn.filter(x=>x>=10&&x<=999&&x!==P);
      // tên hàng: chữ cái trước chữ "kg"
      const nameM=/([A-Za-zÀ-ỹ][A-Za-zÀ-ỹ0-9\-\. ]{2,30}?)\s*[\|\[\]\(\)]*\s*(?:kg|k9|kq|ks)\b/i.exec(r.raw.replace(/^[^A-Za-z]*/,''));
      let rawName=nameM?nameM[1].trim():'';
      if(!rawName){ const w=(r.raw.match(/[A-Za-zÀ-ỹ][A-Za-zÀ-ỹ0-9\-]{2,}/g)||[]).filter(x=>!/^kg$/i.test(x)); rawName=w[0]||''; }
      // khớp NVL
      let matId=null, why='';
      const key=ocrKey(rawName);
      if(key.length>=2 && aliases && aliases[key]){ matId=aliases[key]; why='đã nhớ tên này'; }
      if(!matId && key.length>=2){ let best=null,bs=0; (materials||[]).forEach(m=>{ [m.name,m.fullName].forEach(nm=>{ const k2=ocrKey(nm); if(k2.length<2) return; let sc=0; if(k2===key) sc=1; else if(k2.length>=4&&key.length>=4&&(k2.includes(key)||key.includes(k2))) sc=0.9; else if(Math.max(k2.length,key.length)>=4){ sc=1-ocrLev(k2,key)/Math.max(k2.length,key.length); } if(sc>bs){bs=sc;best=m;} }); }); if(best&&bs>=0.78){ matId=best.id; why='khớp tên'; } }
      let phuy=null, qc=null;
      if(kg){
        if(!matId){ // gợi ý theo kg/phuy
          const hits=(materials||[]).filter(m=>{ const x=ocrPhuyKg(m); return x&&Math.abs(kg/x-Math.round(kg/x))<1e-6&&kg/x>=1&&kg/x<=12&&(qcTok.includes(x)||x===kg); });
          if(hits.length===1){ matId=hits[0].id; why='gợi ý theo kg/phuy'; }
          else if(hits.length>1){ const one=hits.filter(m=>ocrPhuyKg(m)===kg); if(one.length===1){ matId=one[0].id; why='gợi ý theo kg/phuy'; } }
        }
        const m=(materials||[]).find(x=>x.id===matId); const x=m?ocrPhuyKg(m):null;
        if(x&&Math.abs(kg/x-Math.round(kg/x))<1e-6){ qc=x; phuy=Math.round(kg/x); }
        else { const q2=qcTok.find(q=>Math.abs(kg/q-Math.round(kg/q))<1e-6&&kg/q<=12); if(q2){ qc=q2; phuy=Math.round(kg/q2); } }
      }
      const flags=[]; if(!P||!kg) flags.push('không khớp phép tính'); if(!matId) flags.push('chưa nhận ra NVL');
      items.push({rawName, matId, why, kg, price:P, amount:T, phuy, qc, flags});
    });
    const checks={ tHang, vat, tot, sum:items.reduce((a,b)=>a+(b.amount||0),0) };
    slips.push({ date:dt.d?`${String(dt.y)}-${String(dt.m).padStart(2,'0')}-${String(dt.d).padStart(2,'0')}`:'', supplierId:sup?sup.id:'', items, checks, okTotal: tHang? checks.sum===tHang : (tAlt? checks.sum===tAlt : null) });
  });
  return slips;
}
if(typeof module!=='undefined') module.exports={parseSupplierSlips,ocrNorm,ocrKey};

/* ===== NHẬP NVL TỪ ẢNH PHIẾU NCC — đọc ảnh NGAY TRÊN MÁY (Tesseract.js), miễn phí, ảnh không gửi đi đâu =====
   Luồng: chọn ảnh -> máy đọc -> hiện bảng để KIỂM TRA -> bấm Xác nhận mới ghi phiếu nhập NVL.
   Máy tự kiểm phép tính (kg × giá = thành tiền, đối chiếu "Tổng tiền hàng", VAT) và gợi ý NVL theo "1 phuy = X kg". */
var nvlPhoto={open:false,busy:false,msg:'',slips:[]};
var nvlOcrWorker=null;
function nvlLoadTesseract(){ return new Promise((ok,ko)=>{ if(window.Tesseract) return ok(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload=()=>ok(); s.onerror=()=>ko(new Error('Không tải được bộ đọc ảnh. Lần đầu cần có mạng.')); document.head.appendChild(s); }); }
function nvlPhotoSetMsg(t){ nvlPhoto.msg=t; const el=document.getElementById('nvlPhotoMsg'); if(el) el.textContent=t; }
async function nvlGetWorker(){
  if(nvlOcrWorker) return nvlOcrWorker;
  await nvlLoadTesseract();
  nvlOcrWorker = await Tesseract.createWorker('eng',1,{ langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int', logger:m=>{ if(m&&m.status){ nvlPhotoSetMsg('⏳ '+(m.status==='recognizing text'?'Đang đọc ảnh':'Đang chuẩn bị bộ đọc')+(m.progress?' '+Math.round(m.progress*100)+'%':'')+'…'); } } });
  await nvlOcrWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  return nvlOcrWorker;
}
/* Tiền xử lý: lấy kênh ĐỎ làm ảnh xám (con dấu đỏ biến mất), tăng tương phản, nhị phân hóa cục bộ, xóa đường kẻ bảng */
function nvlPreprocess(img, binarize){
  const W0=img.naturalWidth||img.width, H0=img.naturalHeight||img.height;
  let sc=2200/W0; if(H0*sc>5200) sc=5200/H0;
  const w=Math.max(200,Math.round(W0*sc)), h=Math.max(200,Math.round(H0*sc));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
  const id=cx.getImageData(0,0,w,h), d=id.data, n=w*h, g=new Uint8Array(n);
  for(let i=0;i<n;i++) g[i]=d[i*4];
  const hist=new Array(256).fill(0); for(let i=0;i<n;i++) hist[g[i]]++;
  let a=0,lo=0,hi=255; for(let i=0;i<256;i++){ a+=hist[i]; if(a>n*0.01){lo=i;break;} } a=0; for(let i=255;i>=0;i--){ a+=hist[i]; if(a>n*(binarize?0.30:0.01)){hi=i;break;} }
  const sc2=255/Math.max(1,hi-lo); const o=new Uint8Array(n); for(let i=0;i<n;i++){ const v=(g[i]-lo)*sc2; o[i]=v<0?0:v>255?255:v; }
  let out=o;
  if(binarize){
    const I=new Float64Array((w+1)*(h+1));
    for(let y=0;y<h;y++){ let r=0; for(let x=0;x<w;x++){ r+=o[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+r; } }
    const R=Math.round(w/40); out=new Uint8Array(n);
    for(let y=0;y<h;y++){ const y0=Math.max(0,y-R), y1=Math.min(h,y+R+1); for(let x=0;x<w;x++){ const x0=Math.max(0,x-R), x1=Math.min(w,x+R+1); const s=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0]; const m=s/((y1-y0)*(x1-x0)); out[y*w+x]=o[y*w+x]<m*0.88?0:255; } }
    const Lh=Math.round(w*0.045), Lv=Math.round(h*0.02);
    for(let y=0;y<h;y++){ let x=0; while(x<w){ if(out[y*w+x]===0){ let e=x; while(e<w&&out[y*w+e]===0) e++; if(e-x>=Lh){ for(let k=x;k<e;k++) out[y*w+k]=255; } x=e; } else x++; } }
    for(let x=0;x<w;x++){ let y=0; while(y<h){ if(out[y*w+x]===0){ let e=y; while(e<h&&out[e*w+x]===0) e++; if(e-y>=Lv){ for(let k=y;k<e;k++) out[k*w+x]=255; } y=e; } else y++; } }
  }
  for(let i=0;i<n;i++){ const v=out[i]; d[i*4]=v; d[i*4+1]=v; d[i*4+2]=v; d[i*4+3]=255; }
  cx.putImageData(id,0,0); return cv;
}
function nvlSlipScore(slips){ let s=0; slips.forEach(sp=>{ if(sp.okTotal) s+=2; sp.items.forEach(it=>{ if(!it.flags.length) s+=3; else if(it.kg) s+=1; }); }); return s; }
function nvlLoadImage(file){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>ok({im,u}); im.onerror=()=>ko(new Error('Không mở được ảnh này')); im.src=u; }); }
async function nvlPhotoPick(inp){
  const files=[...(inp.files||[])]; if(!files.length) return;
  if(nvlPhoto.busy) return;
  nvlPhoto.busy=true; nvlPhotoSetMsg('⏳ Đang chuẩn bị…');
  try{
    const worker=await nvlGetWorker();
    state.nvlAliases=state.nvlAliases||{};
    for(let fi=0;fi<files.length;fi++){
      nvlPhotoSetMsg('⏳ Ảnh '+(fi+1)+'/'+files.length+': đang xử lý ảnh…');
      const {im,u}=await nvlLoadImage(files[fi]);
      let slips=null, best=-1;
      const cvs={}, all=[];
      for(const cfg of [[false,'4'],[false,'6'],[true,'6'],[false,'3']]){
        const bin=cfg[0]; const cv=cvs[bin]||(cvs[bin]=nvlPreprocess(im,bin));
        nvlPhotoSetMsg('⏳ Ảnh '+(fi+1)+'/'+files.length+': đang đọc…');
        await worker.setParameters({tessedit_pageseg_mode:cfg[1],preserve_interword_spaces:'1'});
        const r=await worker.recognize(cv);
        const sp=parseSupplierSlips(r.data.text, state.materials, state.suppliers, state.nvlAliases);
        const sc=nvlSlipScore(sp); all.push(sp);
        if(sc>best){ best=sc; slips=sp; }
        if(sp.length && sp.every(x=>x.items.length && x.items.every(it=>!it.flags.length))) break;
      }
      if(slips&&slips.length===1){ const s0=slips[0]; all.forEach(sp=>{ if(sp.length===1){ if(!s0.date&&sp[0].date) s0.date=sp[0].date; if(!s0.supplierId&&sp[0].supplierId) s0.supplierId=sp[0].supplierId; } }); }
      if(!slips||!slips.length){ slips=[{date:new Date().toISOString().slice(0,10),supplierId:'',items:[],checks:{},okTotal:null,manual:true}]; }
      slips.forEach(s=>{ s.imgUrl=u; s.file=files[fi].name; nvlPhoto.slips.push(s); });
    }
    nvlPhoto.msg='✅ Đã đọc xong — kiểm tra từng dòng rồi bấm Xác nhận.';
  }catch(e){ console.error(e); nvlPhoto.msg='⚠ Lỗi: '+(e&&e.message||e); }
  nvlPhoto.busy=false; render();
}
function nvlPhotoEdit(si,li,f,v){
  const s=nvlPhoto.slips[si]; if(!s) return;
  if(f==='date'){ s.dateVN=v; const iso=vnToIso(v); if(iso) s.date=iso; }
  else if(f==='sup'){ s.supplierId=v; }
  else { const it=s.items[li]; if(!it) return;
    if(f==='mat'){ it.matId=v; it.flags=it.flags.filter(x=>x!=='chưa nhận ra NVL'); const m=state.materials.find(x=>x.id===v); const x=m?ocrPhuyKg(m):null; if(x&&it.kg&&Math.abs(it.kg/x-Math.round(it.kg/x))<1e-6){ it.qc=x; it.phuy=Math.round(it.kg/x); } }
    else if(f==='kg'){ it.kg=parseVNNumber(v)||0; it.amount=Math.round((it.kg||0)*(it.price||0)); it.flags=it.flags.filter(x=>x!=='không khớp phép tính'); }
    else if(f==='price'){ it.price=parseVNNumber(v)||0; it.amount=Math.round((it.kg||0)*(it.price||0)); it.flags=it.flags.filter(x=>x!=='không khớp phép tính'); }
    else if(f==='inc'){ it.off=!v; } }
  s.checks=s.checks||{}; s.checks.sum=s.items.filter(i=>!i.off).reduce((a,b)=>a+(b.amount||0),0); s.okTotal=s.checks.tHang? s.checks.sum===s.checks.tHang : null;
  render();
}
function nvlPhotoAddLine(si){ const s=nvlPhoto.slips[si]; if(!s) return; s.items.push({rawName:'',matId:'',why:'',kg:0,price:0,amount:0,phuy:null,qc:null,flags:['chưa nhận ra NVL']}); render(); }
function nvlPhotoDrop(si){ nvlPhoto.slips.splice(si,1); if(!nvlPhoto.slips.length) nvlPhoto.msg=''; render(); }
function nvlPhotoConfirm(si){
  const s=nvlPhoto.slips[si]; if(!s) return;
  const iso=s.date; if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)){ alert('Ngày phiếu chưa hợp lệ (dd/mm/yyyy).'); return; }
  const use=s.items.filter(i=>!i.off);
  if(!use.length){ alert('Chưa có dòng nào để nhập.'); return; }
  for(const it of use){ if(!it.matId){ alert('Dòng "'+(it.rawName||'?')+'" chưa chọn NVL.'); return; } if(!(it.kg>0)){ alert('Dòng "'+materialName(it.matId)+'" chưa có số kg.'); return; } }
  const dup=use.filter(it=>state.nvlTx.some(t=>t.type==='in'&&t.date===iso&&t.materialId===it.matId&&Math.abs(Number(t.qty)-it.kg)<0.001&&(t.supplierId||'')===(s.supplierId||'')));
  if(dup.length && !confirm('Đã có phiếu nhập giống hệt (cùng ngày, NVL, số kg, NCC) cho: '+dup.map(d=>materialName(d.matId)).join(', ')+'.\nVẫn nhập thêm?')) return;
  state.nvlAliases=state.nvlAliases||{};
  use.forEach(it=>{
    state.nvlTx.push({id:uid(), materialId:it.matId, type:'in', qty:it.kg, date:iso, note:'Từ ảnh phiếu NCC'+(it.phuy?(' ('+it.phuy+' phuy × '+it.qc+' kg)'):''), supplierId:s.supplierId||null, price:it.price||null, source:'manual', fromPhoto:true});
    const k=ocrKey(it.rawName); if(k.length>=3 && it.matId) state.nvlAliases[k]=it.matId;
  });
  nvlPhoto.slips.splice(si,1);
  nvlPhoto.msg='✅ Đã nhập '+use.length+' dòng vào kho NVL.';
  saveState(); render();
}

function deleteSupplier(id){
  if(state.nvlTx.some(t=>t.supplierId===id)){ alert('Không thể xoá: nhà cung cấp đang gắn với phiếu nhập.'); return; }
  if(!confirm('Xoá nhà cung cấp này?')) return;
  state.suppliers = state.suppliers.filter(s=>s.id!==id);
  saveState(); render();
}
function addPackingType(){
  const name = document.getElementById('newPackingName').value.trim();
  const kg = parseVNNumber(document.getElementById('newPackingKg').value);
  if(!name){ alert('Nhập tên quy cách (VD: Thùng 15kg).'); return; }
  if(isNaN(kg) || kg<=0){ alert('Nhập số kg mỗi đơn vị hợp lệ.'); return; }
  state.packingTypes.push({id: uid(), name, kg});
  saveState(); render();
}
function deletePackingType(id){
  if(state.products.some(p=>p.defaultPackingId===id) || state.productTx.some(t=>t.packingId===id) || state.productSkus.some(s=>s.packingId===id)){ alert('Không thể xoá: quy cách đang gắn với sản phẩm, mã thành phẩm hoặc giao dịch.'); return; }
  if(!confirm('Xoá quy cách đóng gói này?')) return;
  state.packingTypes = state.packingTypes.filter(pk=>pk.id!==id);
  saveState(); render();
}
function addSku(){
  const code = document.getElementById('newSkuCode').value.trim();
  const productNameInput = document.getElementById('newSkuProductName').value.trim();
  const packingNameInput = document.getElementById('newSkuPackingName').value.trim();
  const packingKgInput = document.getElementById('newSkuPackingKg').value.trim();
  const name = document.getElementById('newSkuName').value.trim();
  const priceEl = document.getElementById('newSkuPrice');
  if(!code){ alert('Nhập mã thành phẩm.'); return; }
  if(state.productSkus.some(s=>s.code.toLowerCase()===code.toLowerCase())){ alert('Mã thành phẩm này đã tồn tại.'); return; }
  if(!productNameInput){ alert('Nhập tên sản phẩm gốc.'); return; }
  if(!packingNameInput){ alert('Nhập tên quy cách.'); return; }
  const price = priceEl && priceEl.value.trim() ? parseVNNumber(priceEl.value) : 0;
  if(isNaN(price) || price<0){ alert('Giá bán không hợp lệ.'); return; }
  let product = state.products.find(p=>p.name.trim().toLowerCase()===productNameInput.toLowerCase());
  let packing = state.packingTypes.find(pk=>pk.name.trim().toLowerCase()===packingNameInput.toLowerCase());
  if(!packing){
    const kg = parseVNNumber(packingKgInput);
    if(isNaN(kg) || kg<=0){ alert('Quy cách "'+packingNameInput+'" chưa có sẵn — nhập thêm "Số kg/đvị" hợp lệ để tạo quy cách mới này.'); return; }
    packing = {id: uid(), name: packingNameInput, kg};
    state.packingTypes.push(packing);
  }
  if(!product){
    product = {id: uid(), name: productNameInput, unit:'kg', note:'', price:0, defaultPackingId:null};
    state.products.push(product);
  }
  if(findSkuForCombo(product.id, packing.id)){ alert('Sản phẩm gốc + quy cách này đã có mã khác rồi.'); return; }
  state.productSkus.push({id: uid(), code, name, baseProductId:product.id, packingId:packing.id, price});
  saveState(); render();
}
function saveInlineSku(id, monthStart){
  const s = skuById(id);
  if(!s) return;
  const code = document.getElementById('skuCodeEdit_'+id).value.trim();
  const name = document.getElementById('skuNameEdit_'+id).value.trim();
  const priceEl = document.getElementById('skuPriceEdit_'+id);
  const price = parseVNNumber(priceEl.value);
  if(!code){ alert('Nhập mã thành phẩm.'); return; }
  if(state.productSkus.some(x=>x.id!==id && x.code.toLowerCase()===code.toLowerCase())){ alert('Mã thành phẩm này đã tồn tại.'); return; }
  if(isNaN(price) || price<0){ alert('Giá bán không hợp lệ.'); return; }
  const openInput = document.getElementById('skuOpenEdit_'+id);
  let adjustmentMsg = '';
  if(openInput && monthStart){
    const target = parseVNNumber(openInput.value);
    if(isNaN(target)){ alert('Tồn đầu không hợp lệ.'); return; }
    const pk = packingType(s.packingId);
    const result = applyProductPackingOpeningAdjustment(s.baseProductId, s.packingId, monthStart, target, pk?pk.kg:1);
    if(Math.abs(result.diff) > 1e-9){
      adjustmentMsg = `Chênh lệch mã "${code}":\nSổ sách tính ra: ${fmt(result.baseWithoutAdj)}\nKiểm kho thực tế: ${fmt(target)}\n→ ${result.diff>0?`Thiếu hụt trong sổ sách — đã tự động ghi nhận thêm +${fmt(result.diff)}`:`Hao hụt/thất thoát so với sổ sách — đã tự động trừ bớt ${fmt(Math.abs(result.diff))}`}, tính đến ngày ${isoToVN(dayBefore(monthStart))}.`;
    }
  }
  s.code = code; s.name = name; s.price = price;
  editing.sku = null;
  if(adjustmentMsg) alert(adjustmentMsg);
  saveState(); render();
}
function deleteSku(id){
  const s = skuById(id);
  if(!s) return;
  if(state.productTx.some(t=>t.productId===s.baseProductId && t.packingId===s.packingId)){ alert('Không thể xoá: mã này đang có tồn kho/giao dịch. Hãy tất toán tồn kho trước.'); return; }
  if(!confirm('Xoá mã thành phẩm "'+s.code+'"?')) return;
  state.productSkus = state.productSkus.filter(x=>x.id!==id);
  if(editing.sku===id) editing.sku = null;
  saveState(); render();
}
function addNhapNvl(){
  const materialId = document.getElementById('nhapMatSel').value;
  const qty = parseVNNumber(document.getElementById('nhapQty').value);
  const date = vnToIso(document.getElementById('nhapDate').value);
  const note = document.getElementById('nhapNote').value.trim();
  const supplierId = document.getElementById('nhapSupplier').value || null;
  const priceEl = document.getElementById('nhapPrice');
  let price = null;
  if(priceEl && priceEl.value.trim()){
    const p = parseVNNumber(priceEl.value);
    if(isNaN(p)){ alert('Giá nhập không hợp lệ.'); return; }
    price = p;
  }
  if(!materialId || !qty || qty<=0 || !date){ alert('Chọn NVL, nhập số lượng và ngày hợp lệ (dd/mm/yyyy).'); return; }
  if(editing.nvlTx){
    const t = state.nvlTx.find(x=>x.id===editing.nvlTx);
    if(t){ t.type='in'; t.materialId=materialId; t.qty=qty; t.date=date; t.note=note; t.supplierId=supplierId; t.price=price; }
    editing.nvlTx = null;
  } else {
    state.nvlTx.push({id: uid(), materialId, type:'in', qty, date, note, supplierId, price, source:'manual'});
  }
  saveState(); render();
}

/* --- NVL panel --- */
function computeNvlStockRows(monthStart, monthEndExclusive){
  const q = nvlSearchQuery.trim().toLowerCase();
  const list = sortedMaterials().filter(m=>!q || m.name.toLowerCase().includes(q) || (m.fullName||'').toLowerCase().includes(q));
  if(!state.materials.length) return `<tr class="empty-row"><td colspan="11">Chưa có nguyên vật liệu.</td></tr>`;
  if(!list.length) return `<tr class="empty-row"><td colspan="11">Không tìm thấy NVL nào khớp "${esc(nvlSearchQuery)}".</td></tr>`;
  return list.map(m=>{
    const opening = openingStock(state.nvlTx,'materialId',m.id,monthStart);
    const inM = sumTx(state.nvlTx,'materialId',m.id,monthStart,monthEndExclusive,'in');
    const outM = sumTx(state.nvlTx,'materialId',m.id,monthStart,monthEndExclusive,'out');
    const closing = opening+inM-outM;
    const avgPrice = computeAvgPrice(m);
    const value = closing * avgPrice.value;
    const isLow = closing>=0 && Number(m.minStock||0)>0 && closing<=Number(m.minStock);
    const hasOpeningAdjust = state.nvlTx.some(t=>t.materialId===m.id && t.source==='opening_adjust' && t.date===dayBefore(monthStart));
    const openingBadge = hasOpeningAdjust ? ` <span style="color:#2E6B37;font-size:10px" title="Đã có điều chỉnh tồn đầu (kiểm kho) cho tháng này">✓</span>` : '';
    if(editing.material === m.id){
      return `<tr>
      <td><input id="matNameEdit_${m.id}" type="text" value="${esc(m.name)}" style="width:100%"></td>
      <td><input id="matFullNameEdit_${m.id}" type="text" value="${esc(m.fullName||'')}" placeholder="Tuỳ chọn" style="width:100%"></td>
      <td class="num"><input id="matUnitEdit_${m.id}" type="text" list="matUnitOptions" value="${esc(m.unit)}" style="width:70px;text-align:right"></td>
      <td class="num" style="white-space:nowrap"><input id="openEdit_${m.id}" type="text" value="${fmt(opening)}" style="width:70px;text-align:right">${openingBadge}</td>
      <td class="num in-cell">${inM? '+'+fmt(inM):'0'}</td>
      <td class="num out-cell">${outM? fmt(outM):'0'}</td>
      <td class="num stock-cell ${closing<0?'neg':''}">${fmt(closing)}<br><input id="matMinEdit_${m.id}" type="text" value="${fmt(m.minStock||0)}" placeholder="Tồn tối thiểu" title="Tồn tối thiểu (cảnh báo sắp hết)" style="width:80px;text-align:right;margin-top:4px;font-size:11px"></td>
      <td class="num"><input id="matPriceEdit_${m.id}" type="text" value="${fmt(m.price||0)}" title="Giá dự phòng — chỉ dùng khi chưa có phiếu nhập nào ghi giá" style="width:90px;text-align:right"><div style="font-size:10px;color:var(--muted);margin-top:2px">Giá dự phòng${avgPrice.isAuto?' (đang dùng BQ: '+fmt(avgPrice.value)+')':''}</div></td>
      <td class="num">${fmt(value)}</td>
      <td><input id="matNoteEdit_${m.id}" type="text" value="${esc(m.note||'')}" style="width:100%"></td>
      <td class="num row-actions"><button class="btn-edit" onclick="saveInlineMaterial('${m.id}','${monthStart}')" title="Lưu">✔</button><button class="btn-del" onclick="cancelEdit('material')" title="Huỷ">✕</button></td>
    </tr>`;
    }
    return `<tr>
      <td>${esc(m.name)}${materialHasEstimate(m.id)?' <span title="Có số liệu ƯỚC chưa đối chiếu hoá đơn (xem tab Nhập NVL)" style="background:#FFE3A6;color:#8A4B00;border:1px solid #E8B34A;border-radius:4px;padding:0 5px;font-size:10px;font-weight:700">⚠ ƯỚC</span>':''}</td>
      <td>${esc(m.fullName||'')}</td>
      <td class="num">${esc(m.unit)}</td>
      <td class="num opening-cell">${fmt(opening)}${openingBadge}</td>
      <td class="num in-cell">${inM? '+'+fmt(inM):'0'}</td>
      <td class="num out-cell">${outM? fmt(outM):'0'}</td>
      <td class="num stock-cell ${closing<0?'neg':isLow?'low':''}">${fmt(closing)}${isLow?' ⚠':''}</td>
      <td class="num">${fmt(avgPrice.value)}${avgPrice.isAuto?' <span style="font-size:10px;color:var(--muted)" title="Đơn giá bình quân gia quyền theo lịch sử nhập kho">(BQ)</span>':''}</td>
      <td class="num">${fmt(value)}</td>
      <td>${esc(m.note||'')}</td>
      <td class="num row-actions"><button class="btn-edit" onclick="editing.material='${m.id}'; render();" title="Sửa">✎</button><button class="btn-del" onclick="deleteMaterial('${m.id}')" title="Xoá">✕</button></td>
    </tr>`;
  }).join('');
}
function updateNvlSearch(v){
  nvlSearchQuery = v;
  const tbody = document.getElementById('nvlStockBody');
  if(!tbody) return;
  const { monthStart, monthEndExclusive } = monthBoundsFor(currentYear, currentMonth);
  tbody.innerHTML = computeNvlStockRows(monthStart, monthEndExclusive);
}
function materialUnitOptionsHtml(){
  const units = new Set(['kg','g','m','cái','lít','thùng','can']);
  state.materials.forEach(m=>{ if(m.unit && m.unit!=='—') units.add(m.unit); });
  return [...units].map(u=>`<option value="${esc(u)}">`).join('');
}
function renderNvlPanel(month, monthStart, monthEndExclusive){
  const stockRows = computeNvlStockRows(monthStart, monthEndExclusive);
  const matUnitOptionsHtml = materialUnitOptionsHtml();
  return `
  <div class="panel">
    <div class="panel-head head-nvl"><h2><span class="idx">NVL</span>${monthLabel(month)} — Kho nguyên vật liệu</h2></div>
    <div class="panel-body">
      ${estimatedNvlBanner()}
      <datalist id="matUnitOptions">${matUnitOptionsHtml}</datalist>

      <div class="nvl-toolbar" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">

        <button type="button" class="btn-ghost" style="font-size:12px;padding:7px 10px;border-radius:5px" onclick="exportTableById('nvlStockTable','ton-kho-nvl-${monthLabel(month).replace(' ','-')}-${currentYear}.csv')">⇩ Xuất CSV</button>
      </div>
      ${panelToggles.addMaterial ? `
      <form class="inline-form" style="margin-bottom:16px" onsubmit="event.preventDefault(); addMaterial('${monthStart}');">
        <div class="form-title">+ Thêm nguyên vật liệu mới</div>
        <div class="field"><label>Mã NVL</label><input id="newMatName" type="text" placeholder="VD: D3" style="width:110px" value=""></div>
        <div class="field grow"><label>Tên NVL</label><input id="newMatFullName" type="text" placeholder="Tuỳ chọn — tên đầy đủ" value=""></div>
        <div class="field"><label>ĐVT</label><input id="newMatUnit" type="text" list="matUnitOptions" placeholder="Chọn hoặc gõ mới" style="width:100px" value=""></div>
        <div class="field"><label>Tồn đầu</label><input id="newMatOpening" type="text" placeholder="Tuỳ chọn" style="width:100px" value=""></div>
        <div class="field"><label>Tồn tối thiểu</label><input id="newMatMin" type="text" placeholder="Tuỳ chọn" style="width:100px" value=""></div>
        <div class="field"><label>Giá dự phòng</label><input id="newMatPrice" type="text" placeholder="Tuỳ chọn" title="Chỉ dùng khi chưa có phiếu nhập nào ghi giá" style="width:100px" value=""></div>
        <div class="field grow"><label>Ghi chú</label><input id="newMatNote" type="text" placeholder="Tuỳ chọn" value=""></div>
        <button type="submit" class="btn">+ Thêm NVL</button>
      </form>
      ` : ''}
      <table class="tbl-nvl" id="nvlStockTable">
        <thead><tr><th style="width:90px">Mã NVL</th><th style="width:140px">Tên NVL</th><th style="text-align:right;width:55px">ĐVT</th><th style="text-align:right;width:90px">Tồn đầu</th><th style="text-align:right;width:80px">Nhập</th><th style="text-align:right;width:80px">Xuất</th><th style="text-align:right;width:90px">Tồn cuối</th><th style="text-align:right;width:100px">Đơn giá BQ</th><th style="text-align:right;width:110px">Giá trị tồn</th><th>Ghi chú</th><th class="row-actions" style="width:70px"></th></tr></thead>
        <tbody id="nvlStockBody">${stockRows}</tbody>
      </table>
      <p class="section-note" style="margin-top:10px">Xuất kho NVL được tự động ghi nhận theo định mức khi tạo lệnh sản xuất — không cần thao tác thủ công. Để ghi phiếu nhập kho, vào tab "Nhập NVL". Bấm ✎ trên dòng NVL để sửa trực tiếp trong bảng. <strong>Đơn giá BQ</strong> = đơn giá bình quân gia quyền, tự tính từ giá các phiếu nhập kho đã ghi (tab "Nhập NVL") — nếu NVL chưa có phiếu nhập nào ghi giá, hệ thống dùng "Giá dự phòng" bạn nhập tay. Nhãn <strong style="color:#2E6B37">✓</strong> cạnh "Tồn đầu" nghĩa là NVL đó **đã có** số liệu kiểm kho được nhập cho đúng tháng đang xem — không thấy nhãn này nghĩa là tháng đó chưa nhập kiểm kho.</p>
      ${(()=>{
        const adjustList = state.nvlTx.filter(t=>t.source==='opening_adjust').sort((a,b)=>b.date.localeCompare(a.date));
        const valueOf = (t)=>{
          const mat = state.materials.find(m=>m.id===t.materialId);

        adjustList.forEach(t=>{

        const byMaterial = {};
        adjustList.filter(t=>!isBaselineEntry(t)).forEach(t=>{
          const name = materialName(t.materialId);
          if(!byMaterial[name]) byMaterial[name] = {qty:0, value:0, count:0};
          byMaterial[name].qty += (t.type==='in' ? t.qty : -t.qty);
          byMaterial[name].value += valueOf(t);
          byMaterial[name].count += 1;
        });
        const summaryRows = Object.entries(byMaterial)
          .sort((a,b)=>Math.abs(b[1].value)-Math.abs(a[1].value))
          .map(([name, s])=>`<tr>
            <td>${esc(name)}</td>
            <td class="num">${s.count}</td>
            <td class="num" style="color:${s.qty<0?'#9C3F2B':'#2E6B37'}">${s.qty>0?'+':''}${fmt(s.qty)}</td>
            <td class="num" style="font-weight:600;color:${s.value<0?'#9C3F2B':'#2E6B37'}">${s.value>0?'+':''}${fmt(s.value)}</td>
          </tr>`).join('');
        const totalValue = adjustList.filter(t=>!isBaselineEntry(t)).reduce((s,t)=>s+valueOf(t),0);

        return `
        <p class="subhead" style="margin-top:16px">Thống kê hao hụt/lệch NVL theo kiểm kho — quy ra giá trị tiền</p>
        <p class="section-note">Tổng hợp chênh lệch kiểm kho (âm = hao hụt thật, dương = dư ra) quy đổi ra tiền theo đơn giá bình quân hiện tại — xếp theo mã ảnh hưởng nhiều tiền nhất trước. <strong>Đã loại lần kiểm kho đầu tiên của mỗi mã</strong> (vì đó là số liệu gốc/ước tính, chưa có lần kiểm kho thật trước đó để so sánh nên chưa tính là hao hụt) — chỉ tính chênh lệch giữa các lần kiểm kho thật với nhau.</p>
        <table class="tbl-nvl" style="max-width:560px">
          <thead><tr><th>NVL</th><th style="text-align:right;width:70px">Số lần</th><th style="text-align:right;width:100px">Tổng lệch (kg)</th><th style="text-align:right;width:130px">Giá trị (VNĐ)</th></tr></thead>
          <tbody>${summaryRows || `<tr class="empty-row"><td colspan="4">Chưa có dữ liệu.</td></tr>`}</tbody>
          ${adjustList.length ? `<tr style="font-weight:700;border-top:2px solid var(--line)"><td colspan="3" style="text-align:right">TỔNG GIÁ TRỊ HAO HỤT/DƯ:</td><td class="num" style="color:${totalValue<0?'#9C3F2B':'#2E6B37'}">${totalValue>0?'+':''}${fmt(totalValue)}</td></tr>` : ''}
        </table>
        <p class="subhead" style="margin-top:16px">Các bút toán "Điều chỉnh tồn đầu kỳ" (kiểm kho) đã ghi nhận — tất cả NVL, mọi tháng</p>

function saveXuatNvlNote(txId, value){

const PRODUCT_ROW_COLORS = ['#FCE8E6','#E8F0FE','#FEF7E0','#E6F4EA','#F3E8FD','#FFF0E5','#E0F7FA','#FCE4EC','#EDE7F6','#F1F8E9'];
function productRowColor(productId){
  if(!productId) return '';
  let hash = 0;
  for(let i=0;i<productId.length;i++){ hash = (hash*31 + productId.charCodeAt(i)) >>> 0; }
  return PRODUCT_ROW_COLORS[hash % PRODUCT_ROW_COLORS.length];
}

function computeSkuStockRows(monthStart, monthEndExclusive){

function tpKeyCards(monthStart, monthEndExclusive){
  if(!state.productSkus.length) return '';
  const d90=(()=>{ const d=new Date(monthEndExclusive); d.setDate(d.getDate()-90); return d.toISOString().slice(0,10); })();
  const rows=state.productSkus.map(s=>{
    const pk=packingType(s.packingId), kgU=pk?pk.kg:0;
    const closing=skuOpening(s,monthStart)+skuInOut(s,monthStart,monthEndExclusive,'in')-skuInOut(s,monthStart,monthEndExclusive,'out');
    const out90=skuInOut(s,d90,monthEndExclusive,'out')*(kgU||1);
    return {s,closing,closingKg:closing*(kgU||1),value:closing*Number(s.price||0),out90,perDay:out90/90,kgU};
  }).filter(r=>!/cũ/i.test(r.s.code));
  const _top=rows.filter(r=>r.out90>0).sort((a,b)=>b.out90-a.out90).slice(0,10);
  const _rest=rows.filter(r=>r.out90<=0&&r.closing>0&&Number(r.s.price||0)>0).sort((a,b)=>b.value-a.value);
  rows.length=0; _top.concat(_rest).slice(0,10).forEach(r=>rows.push(r));
  if(!rows.length) return '';
  const totalAll=state.productSkus.reduce((a,s)=>{ const c=skuOpening(s,monthStart)+skuInOut(s,monthStart,monthEndExclusive,'in')-skuInOut(s,monthStart,monthEndExclusive,'out'); return a+c*Number(s.price||0); },0);
  const card=r=>{ const neg=r.closing<0, days=r.perDay>0?r.closingKg/r.perDay:999, low=!neg&&days<14; const cls=neg?'neg':(low?'low':'ok');
    const lab=neg?'ÂM — cần rà soát':(low?'Sắp hết (~'+Math.max(0,Math.round(days))+' ngày)':'Ổn');
    return `<div class="tpk ${cls}"><div class="tpk-h"><b>${esc(r.s.code)}</b><span class="tpk-pill">${lab}</span></div><div class="tpk-n">${esc(skuName(r.s))}</div><div class="tpk-q">${fmt(r.closing)}<small> ${esc(r.kgU?(packingType(r.s.packingId)||{}).name||'đv':'kg')}</small></div>${r.kgU?`<div class="tpk-s">${fmt(r.closingKg)} kg</div>`:''}<div class="tpk-v">${neg?'—':fmt(r.value)+' đ'}</div></div>`; };
  return `<div class="tpk-wrap"><div class="tpk-t">MÃ CHỦ LỰC · 10 mã chủ lực (ưu tiên bán nhiều nhất 90 ngày) <span style="font-weight:500;text-transform:none;color:#6b6250">· tổng giá trị tồn thành phẩm: <b>${fmt(totalAll)} đ</b></span></div><div class="tpk-grid">${rows.map(card).join('')}</div></div>`;
}

function renderXuatTpPanel(month, monthStart, monthEndExclusive){

      <td>${t.customerId?`<strong>${esc(customerName(t.customerId))}</strong>`:''}${t.customerId && t.note?' — ':''}${esc(t.note||'')}${t.source==='production'?' <span style="color:var(--muted);font-size:11px">(tự động — SX)</span>':''}${t.source==='recycle_input'?' <span style="color:#B9601E;font-size:11px">(tự động — tái chế cho SX khác)</span>':''}${t.source==='sale_import'?' <span style="color:#2F6094;font-size:11px">(tự động — QLBH)</span>':''}${t.source==='repack_auto'?' <span style="color:#2F6094;font-size:11px">(tự động — đóng gói)</span>':''}</td>
      <td class="num row-actions">${(t.source==='production'||t.source==='recycle_input'||t.source==='sale_import'||t.source==='repack_auto')?'':`<button class="btn-edit" onclick="editing.productTx='${t.id}'; render();" title="Sửa">✎</button><button class="btn-del" onclick="deleteTx('productTx','${t.id}')">✕</button>`}</td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="6">Chưa có giao dịch thành phẩm trong tháng.</td></tr>`;

  const editingProductTx = editing.productTx ? state.productTx.find(t=>t.id===editing.productTx) : null;
  const customerOptions = `<option value="">-- Không chọn --</option>` + state.customers.map(c=>`<option value="${c.id}" ${editingProductTx && editingProductTx.customerId===c.id?'selected':''}>${c.code?esc(c.code)+' — ':''}${esc(c.name)}</option>`).join('');

  let initialSaleSelValue = '';
  if(editingProductTx){
    if(editingProductTx.packingId){
      const matchedSku = findSkuForCombo(editingProductTx.productId, editingProductTx.packingId);
      initialSaleSelValue = matchedSku ? ('sku:'+matchedSku.id) : ('legacy:'+editingProductTx.productId+':'+editingProductTx.packingId);
    } else {
      initialSaleSelValue = 'raw:'+editingProductTx.productId;
    }
  } else {
    initialSaleSelValue = state.productSkus.length ? ('sku:'+state.productSkus[0].id) : (state.products[0] ? 'raw:'+state.products[0].id : '');
  }
  const legacyOptionHtml = initialSaleSelValue.startsWith('legacy:') ? `<option value="${initialSaleSelValue}" selected>⚠ Quy cách cũ chưa có mã (${esc(productName(editingProductTx.productId))} — ${esc(packingLabel(editingProductTx.packingId))})</option>` : '';
  const saleSelectOptionsHtml =
    (legacyOptionHtml ? `<optgroup label="Giao dịch đang sửa">${legacyOptionHtml}</optgroup>` : '') +
    (state.productSkus.length ? `<optgroup label="Mã thành phẩm">${state.productSkus.map(s=>`<option value="sku:${s.id}" title="${esc(skuName(s))}" ${initialSaleSelValue==='sku:'+s.id?'selected':''}>${esc(s.code)}</option>`).join('')}</optgroup>` : '') +
    `<optgroup label="Kg lẻ (chưa đóng gói)">${state.products.map(p=>`<option value="raw:${p.id}" ${initialSaleSelValue==='raw:'+p.id?'selected':''}>${esc(p.name)} — kg lẻ</option>`).join('')}</optgroup>`;

  let initialSaleProductId, initialSalePackingId=null, initialSaleUnitLabel='kg', initialSaleQtyDisplay='', initialSalePriceDisplay=0;
  if(initialSaleSelValue.startsWith('sku:')){
    const sku = skuById(initialSaleSelValue.slice(4));
    const pk = packingType(sku.packingId);
    initialSaleProductId = sku.baseProductId; initialSalePackingId = sku.packingId; initialSaleUnitLabel = packingLabel(sku.packingId);
    initialSaleQtyDisplay = editingProductTx ? fmt(editingProductTx.packQty) : '';
    initialSalePriceDisplay = editingProductTx ? (editingProductTx.price!=null ? Math.round(editingProductTx.price*pk.kg) : sku.price) : sku.price;
  } else if(initialSaleSelValue.startsWith('legacy:')){
    const parts = initialSaleSelValue.split(':');
    initialSaleProductId = parts[1]; initialSalePackingId = parts[2];
    initialSaleUnitLabel = packingLabel(parts[2]);
    initialSaleQtyDisplay = editingProductTx ? fmt(editingProductTx.packQty) : '';
    initialSalePriceDisplay = editingProductTx ? editingProductTx.price : 0;
  } else if(initialSaleSelValue.startsWith('raw:')){
    initialSaleProductId = initialSaleSelValue.slice(4);
    initialSaleUnitLabel = 'kg';
    initialSaleQtyDisplay = editingProductTx ? fmt(editingProductTx.qty) : '';
    initialSalePriceDisplay = editingProductTx ? editingProductTx.price : currentPrice(initialSaleProductId, editingProductTx?editingProductTx.date:clampToday(monthStart, monthEndExclusive));
  }
  const initialSaleDateIso = editingProductTx ? editingProductTx.date : clampToday(monthStart, monthEndExclusive);
  const initialStockHint = initialSaleProductId ? saleStockHintText(initialSaleSelValue, monthEndExclusive) : '';
  const showForm = panelToggles.addProductTx || !!editingProductTx;

  return `
  <div class="panel">
    <div class="panel-head head-tp"><h2><span class="idx">⇧</span>${monthLabel(month)} — Xuất kho thành phẩm</h2></div>
    <div class="panel-body">
      ${state.products.length ? `
      ${!editingProductTx ? `<button type="button" class="btn" style="margin-bottom:14px" onclick="toggleForm('addProductTx')">+ Thêm mới giao dịch ${panelToggles.addProductTx?'▴':'▾'}</button>` : ''}
      ${showForm ? `
      <form class="inline-form" style="margin-bottom:16px" onsubmit="event.preventDefault(); addProductTx();">
        <div class="form-title">${editingProductTx?'✎ Sửa giao dịch thành phẩm<span class="editing-badge">Đang sửa</span>':'+ Xuất nhập thành phẩm'}</div>
        <div class="field"><label>Loại</label><select id="prodType"><option value="out" ${editingProductTx && editingProductTx.type==='out'?'selected':''}>Xuất kho (bán)</option><option value="in" ${editingProductTx && editingProductTx.type==='in'?'selected':''}>Nhập kho khác</option></select></div>
        <div class="field grow"><label>Mã thành phẩm</label><select id="prodSkuSel" onchange="onSaleSelChange('${monthEndExclusive}')">${saleSelectOptionsHtml}</select></div>
        <div class="field"><label>Số lượng <span id="prodQtyUnitHint" style="font-weight:400;color:var(--muted)">(${esc(initialSaleUnitLabel)})</span></label><input id="prodQty" type="text" inputmode="decimal" style="width:100px" value="${initialSaleQtyDisplay}"></div>
        <div class="field"><label>Giá bán <span id="prodPriceUnitHint" style="font-weight:400;color:var(--muted)">(đ/${esc(initialSaleUnitLabel)})</span></label><input id="prodPrice" type="text" placeholder="Tuỳ chọn" title="Tự điền theo mã thành phẩm / Bảng giá — vẫn sửa được nếu đơn này giá khác" style="width:110px" value="${initialSalePriceDisplay>0?fmt(initialSalePriceDisplay):''}"></div>
        <div class="field"><label>Ngày</label><input id="prodDate" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" style="width:110px" oninput="formatDateInput(this); onSaleSelChange('${monthEndExclusive}', true);" value="${isoToVN(initialSaleDateIso)}"></div>
        <div class="field grow"><label>Khách hàng</label><select id="prodCustomer">${customerOptions}</select></div>
        <div class="field grow"><label>Ghi chú</label><input id="prodNote" type="text" placeholder="Tuỳ chọn" value="${editingProductTx?esc(editingProductTx.note||''):''}"></div>
        <div id="prodStockHint" style="flex-basis:100%;font-size:12px;color:var(--muted)">${initialStockHint}</div>
        <button type="submit" class="btn">${editingProductTx?'Cập nhật':'+ Ghi giao dịch'}</button>
        ${editingProductTx?`<button type="button" class="btn-cancel-edit" onclick="cancelEdit('productTx')">Huỷ</button>`:''}
      </form>
      ` : ''}` : `<p class="section-note">Hãy khai báo sản phẩm ở tab "Kho thành phẩm" trước.</p>`}

      <p class="subhead" style="margin-top:16px">Lịch sử giao dịch trong tháng</p>
      <table class="tbl-tp">
        <thead><tr><th style="width:100px">Ngày</th><th>Thành phẩm</th><th style="width:90px">Loại</th><th style="text-align:right;width:110px">Số lượng</th><th>Khách hàng / Ghi chú</th><th class="row-actions" style="width:70px"></th></tr></thead>
        <tbody>${txRows}</tbody>
      </table>
    </div>
  </div>`;
}
let customerSearchQuery = '';
function computeCustomerRows(){
  const q = customerSearchQuery.trim().toLowerCase();
  const list = [...state.customers].filter(c=>!q || c.name.toLowerCase().includes(q) || (c.code||'').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  if(!state.customers.length) return `<tr class="empty-row"><td colspan="5">Chưa có khách hàng nào.</td></tr>`;
  if(!list.length) return `<tr class="empty-row"><td colspan="5">Không tìm thấy khách hàng nào khớp "${esc(customerSearchQuery)}".</td></tr>`;
  return list.map(c=>{
    const total = sumTx(state.productTx,'customerId',c.id,null,null,'out');
    return `<tr>
      <td>${esc(c.code||'')}</td>
      <td>${esc(c.name)}</td>
      <td class="num">${fmt(total)}</td>
      <td>${esc(c.note||'')}</td>
      <td class="num row-actions"><button class="btn-del" onclick="deleteCustomer('${c.id}')" title="Xoá">✕</button></td>
    </tr>`;
  }).join('');
}
function updateCustomerSearch(v){
  customerSearchQuery = v;

  if(tbody) tbody.innerHTML = computeCustomerRows();
}

function addCustomer(){
  const name = document.getElementById('newCustomerName').value.trim();
  if(!name){ alert('Nhập tên khách hàng.'); return; }
  const code = document.getElementById('newCustomerCode').value.trim();
  const note = document.getElementById('newCustomerNote').value.trim();
  state.customers.push({id: uid(), code, name, note});
  saveState(); render();
}
function deleteCustomer(id){
  if(state.productTx.some(t=>t.customerId===id)){ alert('Không thể xoá: khách hàng đang gắn với giao dịch.'); return; }
  if(!confirm('Xoá khách hàng này?')) return;
  state.customers = state.customers.filter(c=>c.id!==id);
  saveState(); render();
}
function addPriceEntry(){
  const productId = document.getElementById('priceProdSel').value;
  const priceEl = document.getElementById('priceValue');
  const price = parseVNNumber(priceEl.value);
  const date = vnToIso(document.getElementById('priceDate').value);
  const note = document.getElementById('priceNote').value.trim();
  if(!productId || isNaN(price) || price<0 || !date){ alert('Chọn sản phẩm, nhập giá bán và ngày hiệu lực hợp lệ (dd/mm/yyyy).'); return; }
  state.priceList.push({id: uid(), productId, date, price, note});
  saveState(); render();
}
function deletePriceEntry(id){
  if(!confirm('Xoá dòng giá này?')) return;
  state.priceList = state.priceList.filter(e=>e.id!==id);
  saveState(); render();
}
function parseSaleSelValue(value){
  if(!value) return null;
  if(value.startsWith('sku:')){
    const sku = skuById(value.slice(4));
    if(!sku) return null;
    return {productId: sku.baseProductId, packingId: sku.packingId, isSku:true, sku, unitLabel: packingLabel(sku.packingId)};
  }
  if(value.startsWith('legacy:')){
    const parts = value.split(':');
    return {productId: parts[1], packingId: parts[2], isSku:false, sku:null, unitLabel: packingLabel(parts[2])};
  }
  if(value.startsWith('raw:')){
    return {productId: value.slice(4), packingId: null, isSku:false, sku:null, unitLabel:'kg'};
  }
  return null;
}
function saleStockHintText(selValue, monthEndExclusive){
  const info = parseSaleSelValue(selValue);
  if(!info) return '';
  if(info.packingId){
    const stock = state.productTx.filter(t=>t.productId===info.productId && t.packingId===info.packingId && t.date<monthEndExclusive)
      .reduce((s,t)=>s+(t.type==='in'?1:-1)*Number(t.packQty||0),0);
    return `Tồn hiện có: <strong>${fmt(stock)} ${esc(packingLabel(info.packingId))}</strong>`;
  }
  const closing = openingStock(state.productTx,'productId',info.productId,monthEndExclusive);
  return `Tồn hiện có: <strong>${fmt(closing)} kg</strong>${productPackBreakdownDisplay(info.productId, monthEndExclusive)}`;
}
function onSaleSelChange(monthEndExclusive, dateOnly){
  const sel = document.getElementById('prodSkuSel');
  if(!sel) return;
  const info = parseSaleSelValue(sel.value);
  if(!info) return;
  const qtyHint = document.getElementById('prodQtyUnitHint');
  const priceHint = document.getElementById('prodPriceUnitHint');
  const priceEl = document.getElementById('prodPrice');
  const stockEl = document.getElementById('prodStockHint');
  const dateEl = document.getElementById('prodDate');
  if(qtyHint) qtyHint.textContent = `(${info.unitLabel})`;
  if(priceHint) priceHint.textContent = `(đ/${info.unitLabel})`;
  if(stockEl) stockEl.innerHTML = saleStockHintText(sel.value, monthEndExclusive);
  if(!dateOnly && priceEl && !priceEl.value.trim()){
    if(info.isSku){
      if(info.sku.price>0) priceEl.value = fmt(info.sku.price);
    } else if(!info.packingId){
      const date = dateEl ? (vnToIso(dateEl.value)||todayStr()) : todayStr();
      const p = currentPrice(info.productId, date);
      if(p>0) priceEl.value = fmt(p);
    }
  }
}
function txDisplayPrice(t){
  if(t.price==null) return null;
  if(t.packingId){
    const pk = packingType(t.packingId);
    return pk ? Math.round(t.price*pk.kg) : t.price;
  }
  return t.price;
}
function addProductTx(){
  const type = document.getElementById('prodType').value;
  const info = parseSaleSelValue(document.getElementById('prodSkuSel').value);
  if(!info){ alert('Chọn mã thành phẩm hoặc kg lẻ hợp lệ.'); return; }
  const enteredQty = parseVNNumber(document.getElementById('prodQty').value);
  const date = vnToIso(document.getElementById('prodDate').value);
  const note = document.getElementById('prodNote').value.trim();
  const customerId = document.getElementById('prodCustomer').value || null;
  const priceEl = document.getElementById('prodPrice');
  let enteredPrice = null;
  if(priceEl && priceEl.value.trim()){
    const p = parseVNNumber(priceEl.value);
    if(isNaN(p)){ alert('Giá bán không hợp lệ.'); return; }
    enteredPrice = p;
  }
  if(!enteredQty || enteredQty<=0 || !date){ alert('Nhập số lượng và ngày hợp lệ (dd/mm/yyyy).'); return; }
  const productId = info.productId, packingId = info.packingId;
  let qty, packQty = null, price = enteredPrice;
  if(packingId){
    const pk = packingType(packingId);
    qty = enteredQty * (pk?pk.kg:1);
    packQty = enteredQty;
    if(enteredPrice!=null && pk && pk.kg>0) price = enteredPrice / pk.kg;
  } else {
    qty = enteredQty;
  }
  if(editing.productTx){
    const t = state.productTx.find(x=>x.id===editing.productTx);
    if(t){ t.type=type; t.productId=productId; t.qty=qty; t.date=date; t.note=note; t.customerId=customerId; t.price=price; t.packingId=packingId; t.packQty=packQty; }
    editing.productTx = null;
  } else {
    state.productTx.push({id: uid(), productId, type, qty, date, note, customerId, price, source:'manual', packingId, packQty});
  }
  saveState(); render();
}

function deleteTx(listName, id){
  if(!confirm('Xoá giao dịch này?')) return;
  state[listName] = state[listName].filter(t=>t.id!==id);
  if(listName==='nvlTx' && editing.nvlTx===id) editing.nvlTx = null;
  if(listName==='productTx' && editing.productTx===id) editing.productTx = null;
  saveState(); render();
}

loadState();
</script>

/* Đưa "Kho dùng chung / Xuất PDF / dữ liệu QLBH" lên cùng hàng tab chính, tiết kiệm 1 hàng */
(function(){
  var busy=false;
  function place(){
    if(busy) return; busy=true;
    try{
      var row=document.querySelector('.nv-g-row'); if(!row){busy=false;return}
      var ex=document.getElementById('tabsExtra');
      var anyTop=document.querySelector('.bh-bar[data-top]');
      if(!anyTop){ if(ex) ex.remove(); busy=false; return; }
      var bar=document.querySelector('.bh-bar[data-top]:not([data-moved])');
      if(!bar){ busy=false; return; }
      if(!ex){ ex=document.createElement('div'); ex.id='tabsExtra'; ex.style.cssText='margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;white-space:nowrap'; }
      if(ex.parentNode!==row) row.appendChild(ex);
      ex.innerHTML=''; ex.title='';
      Array.prototype.slice.call(bar.children).forEach(function(c){
        if(c.classList&&c.classList.contains('sp')) return;
        if(c.tagName==='INPUT') return;
        if(c.tagName==='SPAN'&&/Dữ liệu QLBH|Chưa có dữ liệu/.test(c.textContent)){ ex.title=c.textContent.trim(); return; }
        ex.appendChild(c);
      });
      bar.style.display='none'; bar.setAttribute('data-moved','1');
    }catch(e){}
    busy=false;
  }
  var t=null;
  new MutationObserver(function(){ if(busy) return; clearTimeout(t); t=setTimeout(place,30); }).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('load',place);
})();
</script>

<script>
/* Gắn nhãn cột (data-label) cho mọi ô của mọi bảng để điện thoại hiện dạng thẻ — chạy lại mỗi khi app vẽ lại. */
(function(){

    var main=document.getElementById('main'); if(!main) return;
    main.querySelectorAll('table').forEach(function(t){
      var ths=t.querySelectorAll(':scope > thead > tr:last-child > th'); if(!ths.length) return;
      var names=[]; ths.forEach(function(th){ var n=(th.innerText||th.textContent||'').replace(/\s+/g,' ').trim(); var span=th.colSpan||1; for(var k=0;k<span;k++) names.push(n); });
      t.classList.add('cardtbl');
      t.querySelectorAll(':scope > tbody > tr, :scope > tr').forEach(function(tr){
        var i=0; Array.prototype.forEach.call(tr.children,function(td){ if(td.tagName!=='TD') return; if(!td.hasAttribute('data-label')) td.setAttribute('data-label', names[i]||''); i+=td.colSpan||1; });
      });
    });
  }
  var m=document.getElementById('main'); if(!m){ document.addEventListener('DOMContentLoaded',function(){ m=document.getElementById('main'); if(m) new MutationObserver(function(){ clearTimeout(window.__lbT); window.__lbT=setTimeout(label,30); }).observe(m,{childList:true,subtree:true}); label(); }); }
  else { new MutationObserver(function(){ clearTimeout(window.__lbT); window.__lbT=setTimeout(label,30); }).observe(m,{childList:true,subtree:true}); label(); }
})();
</script>
